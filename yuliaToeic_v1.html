    <div class="cat-stage idle-live tappable" data-action="tapPet">${catSayHtml('はじめまして！', { id: 'pet-speech' })}${catHtml(stage, { size: 170 })}</div>
    <div class="card">
      <p>ぼくは、まだ小さな<strong>こねこ</strong>。<br>ゆめは、山のてっぺんの🏆にたどりつくこと。</p>
      <p class="welcome-road">${road}</p>
      <p>${DATA.user.name}さんが<strong>英語の力</strong>をつけると、<br>ぼくも先へ進めて、大きくなれるんだ。</p>
      <p><strong>いっしょに目標スコアを目指そう！</strong></p>
    </div>
    <a class="btn" href="#/welcome/name">いいよ！</a>
  </div>`;
}

function renderPetSession(app) {
  if (!APP_STATE.petSession || APP_STATE.petSession.index >= APP_STATE.petSession.cards.length) startPetSession();
  const session = APP_STATE.petSession;
  const word = session.cards[session.index];
  const stage = getCurrentPetStage();
  const progressPct = Math.round((session.index / session.cards.length) * 100);
  app.innerHTML = `
    <h1>🤚 なでなでタイム（${session.index + 1}/${session.cards.length}）</h1>
    <div class="progress"><div class="progress-fill" style="width:${progressPct}%"></div></div>
    <div class="cat-stage small tappable" data-action="revealPetCard">
      ${catHtml(stage, { anim: session.revealed ? 'anim-purr' : '', size: 100 })}
      ${session.revealed ? `<span class="pet-hand">🤚</span>${heartsHtml(3)}${catSayHtml(stageLine('pet', session.index), { side: true })}` : ''}
    </div>
    <div class="card flashcard" data-action="revealPetCard" style="flex-direction:column; min-height:110px;">
      <div>${word.w}</div>
      ${session.revealed ? `<div class="muted" style="font-size:1.125rem; margin-top:8px;">${word.m}</div>` : ''}
    </div>
    ${session.revealed
      ? `<p class="center muted">意味、おぼえてた？</p>
         <div class="row-flex">
           <button class="btn" data-action="ratePetCard" data-known="1">😺 おぼえてた</button>
           <button class="btn secondary" data-action="ratePetCard" data-known="0">🙀 まだかも</button>
         </div>`
      : `<button class="btn" data-action="revealPetCard">🤚 なでなでして意味を見る</button>`}
    <p class="center" style="margin-top:28px;"><button class="quit-link" data-action="quitPet">✕ 途中でやめる</button></p>
  `;
}

function renderPetResult(app) {
  const session = APP_STATE.petSession;
  if (!session || session.results.length === 0) { location.hash = '#/home'; return; }
  const rows = session.results.map((r) => `
    <div class="rank-row"><span>${r.word.w}</span><span class="muted">${r.known ? '😺' : '🙀'} ${r.word.m}</span></div>
  `).join('');
  app.innerHTML = `
    <h1>なでなでタイム：おしまい</h1>
    ${gameResultCardHtml(session)}
    <div class="card">${rows}</div>
    <div class="actionbar">
      <button class="btn btn-feed" style="margin-top:0;" data-action="startPet">🤚 もう1回なでる</button>
      <a class="btn secondary" href="#/home">ホームにもどる</a>
    </div>
  `;
}

function renderVocabResult(app) {
  const session = APP_STATE.vocabSession;
  // 結果はメモリ上にしか無いので、再読み込み後は表示できない→ホームへ戻す(真っ白/真っ黒画面の防止)
  if (!session || session.results.length === 0) { location.hash = '#/home'; return; }
  const rows = session.results.map((r) => `
    <div class="rank-row"><span>${r.word.w}</span><span class="muted">${r.isCorrect ? '○' : '× (' + r.word.m + ')'}</span></div>
  `).join('');
  const isReview = session.mode === 'review';
  const isQuick = session.mode === 'quick';
  const remaining = isReview ? session.reviewTotalWrong - (session.reviewOffset + session.questions.length) : 0;
  if (isQuick) {
    app.innerHTML = `
      <h1>ごはんタイム：${session.correct}/${session.questions.length}問正解</h1>
      ${gameResultCardHtml(session)}
      <div class="card">${rows}</div>
      <div class="actionbar">
        <button class="btn btn-feed" style="margin-top:0;" data-action="startQuickQuiz">🍚 もう1回（1分）</button>
        <a class="btn secondary" href="#/home">ホームにもどる</a>
      </div>
    `;
    return;
  }
  app.innerHTML = `
    <h1>${isReview ? '復習モード：結果' : '語彙クイズ結果'}</h1>
    <div class="card center"><p style="font-size:2rem; font-weight:700;">${session.correct}/${session.questions.length}</p></div>
    ${gameResultCardHtml(session)}
    <div class="card">${rows}</div>
    <div class="actionbar">
      ${isReview
        ? (remaining > 0
            ? `<button class="btn" data-action="continueVocabReview" data-offset="${session.reviewOffset + session.questions.length}">次のセットに進む（残り${remaining}語）</button>`
            : `<p class="center muted">お疲れさまでした、苦手単語は以上です！</p>`)
        : `<button class="btn secondary" data-action="startVocabQuiz">もう一度</button>`}
      <a class="btn" href="#/vocab">語彙メニューに戻る</a>
    </div>
  `;
}

function renderP7bRetest(app) {
  const baseline = DATA.user.parts.P7B;
  app.innerHTML = `
    ${pageHeroHtml('diagnosis', '🔍 精密診断（Part7B）', '時間を気にせず解いてみてね')}
    <div class="card">
      <p>手持ちの教材でPart7B（複数文書問題）を、時間無制限で解き直してください。</p>
      <p class="muted">解き終えたら、その正答率を入力してください。（前回の正答率: ${pct(baseline)}）</p>
      <div class="field">
        <label>再テスト正答率 <span id="val-retest">50%</span></label>
        <input type="range" min="0" max="100" step="1" value="50" id="retest-range">
      </div>
    </div>
    <div class="actionbar"><button class="btn" data-action="submitP7bRetest">判定する</button>
    <a class="btn secondary" href="#/diagnosis">診断結果に戻る</a></div>
  `;
  document.getElementById('retest-range').addEventListener('input', (e) => {
    document.getElementById('val-retest').textContent = e.target.value + '%';
  });
}

function renderP7bResult(app) {
  const result = DATA.user.p7bPrecisionResult;
  app.innerHTML = `
    ${pageHeroHtml('diagnosis', '🔍 精密診断の結果', '原因がわかったにゃ')}
    <div class="card center">
      <p style="font-size:1.25rem; font-weight:700;">${result.verdict}</p>
      <p class="muted">ベースライン${pct(result.baseline)} → 再テスト${pct(result.retestAccuracy)}（差 ${Math.round(result.diff * 100)}pt）</p>
    </div>
    <div class="actionbar"><a class="btn" href="#/diagnosis">診断結果に戻る</a></div>
  `;
}

/* ==================== 13. イベント委譲 + 起動 ==================== */
const ACTIONS = {
  setHasTakenToeic: (d) => { DATA.user.hasTakenToeic = d.value === 'yes'; save(DATA); render(); },
  setFontScale: (d) => { DATA.settings.fontScale = d.key; save(DATA); applyFontScale(d.key); render(); },
  resetExperienceGate: () => { DATA.user.hasTakenToeic = null; save(DATA); render(); },
  setSelfLevel: (d) => { DATA.user.beginnerProfile.selfLevel = d.key; render(); },
  submitBeginnerProfile: () => {
    const p = DATA.user.beginnerProfile;
    if (!p.selfLevel) return;
    p.eikenLevel = document.getElementById('eiken-select').value;
    p.experienceNote = document.getElementById('experience-note').value;
    const levelDef = CONFIG.selfDiagnosisLevels.find((lv) => lv.key === p.selfLevel);
    const acc = interpolateScoreToAccuracy(levelDef.score, CONFIG.goal.scoreToAccuracyTable);
    CONFIG.partOrder.forEach((pk) => { DATA.user.parts[pk] = acc; });
    const diagnosis = runDiagnosis(DATA.user, CONFIG);
    DATA.user.flags = diagnosis.flags;
    DATA.history.push({ date: new Date().toISOString().slice(0, 10), parts: Object.assign({}, DATA.user.parts), note: '自己診断（' + levelDef.label + '）' });
    APP_STATE.diagnosis = diagnosis;
    APP_STATE.weeklyMenu = null;
    save(DATA);
    location.hash = '#/diagnosis';
  },
  setGoalMode: (d) => { captureInputForm(); DATA.user.goalMode = d.mode; render(); },
  submitInput: () => {
    captureInputForm();
    const goalFixedRange = document.getElementById('goal-fixed-range');
    const goalScoreRange = document.getElementById('goal-score-range');
    if (DATA.user.goalMode === 'fixed' && goalFixedRange) DATA.user.goalValue = Number(goalFixedRange.value) / 100;
    if (DATA.user.goalMode === 'score' && goalScoreRange) DATA.user.goalValue = Number(goalScoreRange.value);
    const diagnosis = runDiagnosis(DATA.user, CONFIG);
    DATA.user.flags = diagnosis.flags;
    DATA.history.push({ date: new Date().toISOString().slice(0, 10), parts: Object.assign({}, DATA.user.parts), note: '' });
    APP_STATE.diagnosis = diagnosis;
    APP_STATE.weeklyMenu = null;
    save(DATA);
    location.hash = '#/diagnosis';
  },
  reportP7b: (d) => { setP7bSelfReport(d.status); render(); },
  regenerateMenu: () => { APP_STATE.weeklyMenu = null; render(); },
  startGrammarQuiz: (d) => { startGrammarQuiz(d.unitId); location.hash = `#/grammar/${d.unitId}/quiz`; },
  startGrammarReview: () => { startGrammarReviewQuiz(0); location.hash = '#/grammar/review/quiz'; render(); },
  continueGrammarReview: (d) => { startGrammarReviewQuiz(Number(d.offset)); location.hash = '#/grammar/review/quiz'; render(); },
  chooseGrammarAnswer: (d) => { submitGrammarAnswer(Number(d.index)); render(); },
  nextGrammarQuestion: () => { advanceGrammarQuestion(); },
  quitGrammarQuiz: () => {
    const session = APP_STATE.grammarSession;
    const isReview = session && session.mode === 'review';
    const unitId = session ? session.unitId : null;
    const isPlay = session && session.mode === 'play';
    APP_STATE.grammarSession = null;
    if (isPlay) { location.hash = '#/home'; return; }
    location.hash = isReview ? '#/grammar' : (unitId ? `#/grammar/${unitId}` : '#/grammar');
  },
  startVocabFlashcards: () => { startFlashcardSession(20); location.hash = '#/vocab/flashcards'; },
  startVocabQuiz: () => { startVocabQuiz(CONFIG.menuRules.vocabQuestionCountPerBlock); location.hash = '#/vocab/quiz'; render(); },
  startVocabReview: () => { startVocabReviewQuiz(0); location.hash = '#/vocab/quiz'; render(); },
  continueVocabReview: (d) => { startVocabReviewQuiz(Number(d.offset)); location.hash = '#/vocab/quiz'; render(); },
  chooseVocabAnswer: (d) => { submitVocabAnswer(Number(d.index)); render(); },
  nextVocabQuestion: () => { advanceVocabQuestion(); },
  quitVocabQuiz: () => {
    const s = APP_STATE.vocabSession;
    APP_STATE.vocabSession = null;
    location.hash = s && s.tutorial ? '#/welcome/feed' : s && s.mode === 'quick' ? '#/home' : '#/vocab';
  },
  startTest: () => {
    startTestSession();
    if (location.hash === '#/test') render(); else location.hash = '#/test';
  },
  chooseTestAnswer: (d) => { submitTestAnswer(Number(d.index)); render(); },
  nextTestQuestion: () => { advanceTestQuestion(); },
  quitTest: () => { APP_STATE.testSession = null; location.hash = '#/journey'; },
  saveWelcomeName: () => {
    const el = document.getElementById('pet-name-input');
    const name = el ? el.value.trim().slice(0, 10) : '';
    if (name) { DATA.progress.game.petName = name; save(DATA); }
    location.hash = '#/welcome/feed';
  },
  skipWelcomeName: () => { location.hash = '#/welcome/feed'; },
  startTutorial: () => {
    startVocabQuiz(3, 'quick');
    APP_STATE.vocabSession.tutorial = true;
    location.hash = '#/vocab/quiz';
  },
  finishOnboarding: () => {
    DATA.progress.game.onboarded = true;
    save(DATA);
    location.hash = '#/home';
  },
  replayOnboarding: () => {
    DATA.progress.game.onboarded = false;
    save(DATA);
    location.hash = '#/welcome';
  },
  // ごはん＝1分単語クイズ(startQuickQuizは旧名。互換のため残す)
  startFeed: () => ACTIONS.startQuickQuiz(),
  startQuickQuiz: () => {
    startVocabQuiz(CONFIG.game.quickQuizCount, 'quick');
    // 既にクイズ画面にいる(「もう1回」)場合はhashchangeが起きないので明示的に描画する
    if (location.hash === '#/vocab/quiz') render(); else location.hash = '#/vocab/quiz';
  },
  startPlay: () => {
    startGrammarPlayQuiz();
    if (location.hash === '#/grammar/play/quiz') render(); else location.hash = '#/grammar/play/quiz';
  },
  startPet: () => {
    startPetSession();
    if (location.hash === '#/pet') render(); else location.hash = '#/pet';
  },
  revealPetCard: () => {
    const session = APP_STATE.petSession;
    if (!session || session.revealed) return;
    session.revealed = true;
    playPurr();
    render();
  },
  ratePetCard: (d) => { ratePetCard(d.known === '1'); },
  quitPet: () => { APP_STATE.petSession = null; location.hash = '#/home'; },
  // ホームのねこをタップ：再描画せずにその場でゴロゴロさせる(アニメが途切れないように)
  tapPet: () => {
    const stageEl = document.querySelector('.cat-stage.idle-live');
    const cat = stageEl && stageEl.querySelector('.cat');
    if (!cat) return;
    clearTimeout(cat._animTimer);
    cat.className = cat.className.replace(/\banim-\S+/g, '').trim() + ' anim-purr';
    stageEl.insertAdjacentHTML('beforeend', heartsHtml(3));
    const lines = CONFIG.game.moodLines.tap;
    const speechEl = document.getElementById('pet-speech');
    if (speechEl) {
      speechEl.textContent = lines[Math.floor(Math.random() * lines.length)];
      // 吹き出しのポンッと出るアニメをもう一度再生する
      speechEl.style.animation = 'none';
      void speechEl.offsetWidth;
      speechEl.style.animation = '';
    }
    playPurr();
    cat._animTimer = setTimeout(() => {
      cat.classList.remove('anim-purr');
      stageEl.querySelectorAll('.heart').forEach((h) => h.remove());
    }, 2500);
  },
  renamePet: () => {
    const name = window.prompt('ペットのなまえは？（10文字まで）', DATA.progress.game.petName || '');
    if (name == null) return;
    DATA.progress.game.petName = name.trim().slice(0, 10);
    save(DATA);
    render();
  },
  // <details>の開閉はブラウザが行うので、再描画後も同じ状態を保つためにフラグだけ反転する
  toggleHomeMenu: () => { APP_STATE.homeMenuOpen = !APP_STATE.homeMenuOpen; },
  dismissGameOverlay: () => { APP_STATE.gameOverlays.shift(); render(); },
  setSound: (d) => { DATA.settings.soundOn = d.on === '1'; save(DATA); render(); },
  flipCard: () => { APP_STATE.flashSession.flipped = !APP_STATE.flashSession.flipped; APP_STATE.flashJustFlipped = true; render(); },
  nextCard: () => { advanceFlashcard(1); },
  prevCard: () => { advanceFlashcard(-1); },
  submitP7bRetest: () => {
    const val = Number(document.getElementById('retest-range').value) / 100;
    submitP7bPrecisionResult(val);
    location.hash = '#/p7b/result';
  },
  shiftHomeDay: (d) => {
    const cur = APP_STATE.selectedDayIndex ?? jsDayToAppIndex(new Date().getDay());
    APP_STATE.selectedDayIndex = ((cur + Number(d.delta)) % 7 + 7) % 7;
    render();
  },
  dismissCelebration: () => { render(); },
  shiftCalendarMonth: (d) => {
    const s = shiftMonth(APP_STATE.calendarYear, APP_STATE.calendarMonth, Number(d.delta));
    APP_STATE.calendarYear = s.year;
    APP_STATE.calendarMonth = s.month;
    APP_STATE.selectedCalendarDay = null;
    render();
  },
  selectCalendarDay: (d) => {
    APP_STATE.selectedCalendarDay = APP_STATE.selectedCalendarDay === d.date ? null : d.date;
    render();
  },
};

if (typeof window !== 'undefined') {
  window.addEventListener('DOMContentLoaded', () => {
    DATA = load();
    initGameState(DATA);
    initJourney(DATA);
    updateJourney(true);
    save(DATA);
    applyFontScale(DATA.settings.fontScale);
    document.getElementById('app').addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const handler = ACTIONS[el.dataset.action];
      if (handler) handler(el.dataset, e);
    });
    if (!location.hash) location.hash = DATA.progress.game.onboarded ? '#/home' : '#/welcome';
    render();
    window.addEventListener('hashchange', render);
    startCatIdleLoop();
  });
}
</script>
</body>
</html>
