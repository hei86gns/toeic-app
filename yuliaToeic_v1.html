<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>ゆりあTOEIC v1</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ゆりあTOEIC">
<meta name="theme-color" content="#3b5bfd">
<style>
:root{
  --bg:#f6f5fb; --card:#ffffff; --text:#232228; --muted:#7a7686;
  --primary:#3b5bfd; --primary-dark:#2a42c9; --danger:#e5484d; --success:#2f9e44;
  --warning:#c07a00; --radius:20px; --accent-warm:#ff9f6b; --accent-warm-dark:#e8804a;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#17161d; --card:#242230; --text:#f0eef5; --muted:#a29dae; --primary:#8098ff; --primary-dark:#6b82e6;
    --accent-warm:#ffab7d; --accent-warm-dark:#ff9257; }
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html{ font-size:16px; }
body{ margin:0; padding:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif; font-size:1rem; }
/* ページ全体はスクロールさせず、#scroller の中だけをスクロールさせる(アプリ型レイアウト)。
   iOS 26以降のSafari/ホーム画面アプリでは、ページ全体をスクロールすると画面の高さが変わり、
   下部ナビ(position:fixed)が上にズレる。画面の枠を動かさないことでこれを防ぐ */
html, body{ height:100%; overflow:hidden; }
#scroller{ position:fixed; inset:0; overflow-y:auto; overscroll-behavior-y:contain; }
#app{ max-width:480px; margin:0 auto; padding:20px 16px 24px; min-height:100%; }
#app.has-bottom-nav{ padding-bottom:96px; }
h1{ font-size:1.25rem; margin:0 0 12px; }
h2{ font-size:1rem; margin:0 0 10px; }
p{ line-height:1.7; margin:0 0 8px; }
a{ color:inherit; }
.card{ background:var(--card); border-radius:var(--radius); padding:16px; margin-bottom:12px; box-shadow:0 4px 16px rgba(30,20,60,.06); }
.field{ margin-bottom:18px; }
.field:last-child{ margin-bottom:4px; }
.field label{ display:flex; justify-content:space-between; font-weight:600; margin-bottom:6px; font-size:0.875rem; }
input[type=range]{ width:100%; height:32px; accent-color:var(--primary); }
.btn{ display:block; width:100%; min-height:44px; border:none; border-radius:16px; background:var(--primary);
  color:#fff; font-size:1rem; font-weight:700; padding:11px 16px; text-align:center; text-decoration:none;
  cursor:pointer; margin-bottom:8px; }
.btn:disabled{ opacity:.4; }
.btn.secondary{ background:transparent; color:var(--primary); border:1px solid var(--primary); }
.btn.small{ min-height:36px; font-size:0.875rem; width:auto; display:inline-block; padding:8px 14px; }
.actionbar{ position:sticky; bottom:0; left:0; right:0; background:var(--bg); padding:12px 0 0;
  margin-top:8px; box-shadow:0 -6px 10px -6px rgba(0,0,0,.15); }
.badge{ display:inline-block; padding:3px 10px; border-radius:999px; font-size:0.75rem; font-weight:700; margin:0 6px 6px 0; }
.badge.warn{ background:rgba(192,122,0,.15); color:var(--warning); }
.badge.rank{ background:rgba(59,91,253,.15); color:var(--primary); }
.rank-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid rgba(128,128,128,.15); gap:12px; }
.rank-row:last-child{ border-bottom:none; }
.choice-btn{ display:block; width:100%; text-align:left; min-height:48px; border-radius:14px;
  border:1px solid rgba(128,128,128,.35); background:var(--card); color:var(--text); padding:12px 14px;
  margin-bottom:8px; font-size:1rem; cursor:pointer; }
.choice-btn.correct{ background:rgba(47,158,68,.15); border-color:var(--success); }
.choice-btn.incorrect{ background:rgba(229,72,77,.15); border-color:var(--danger); }
.progress{ height:6px; background:rgba(128,128,128,.2); border-radius:3px; overflow:hidden; margin-bottom:16px; }
.progress-fill{ height:100%; background:var(--primary); }
.flashcard{ min-height:180px; display:flex; align-items:center; justify-content:center; text-align:center;
  font-size:1.5rem; font-weight:600; padding:24px; cursor:pointer; }
.day-title{ font-weight:700; margin:20px 0 8px; font-size:0.9375rem; color:var(--muted); }
.day-title:first-of-type{ margin-top:0; }
.muted{ color:var(--muted); font-size:0.875rem; }
.segmented{ display:flex; border:1px solid var(--primary); border-radius:14px; overflow:hidden; margin-bottom:14px; }
.segmented button{ flex:1; padding:10px; border:none; background:transparent; color:var(--primary); font-weight:700; font-size:0.875rem; }
.segmented button.active{ background:var(--primary); color:#fff; }
.center{ text-align:center; }
.row-flex{ display:flex; gap:8px; }
.row-flex .btn{ flex:1; }
details summary{ cursor:pointer; font-weight:600; font-size:0.875rem; margin:8px 0; }
details p, details li{ font-size:0.875rem; }

.home-title{ text-align:center; font-size:1.375rem; margin:6px 0 2px; }
.streak-line{ text-align:center; color:var(--accent-warm-dark); font-weight:700; font-size:0.875rem; margin:0 0 14px; }
.day-nav{ display:flex; align-items:center; justify-content:space-between; margin:0 0 18px; }
.day-nav-label{ font-size:1.125rem; font-weight:700; text-align:center; flex:1; }
.day-nav-arrow{ width:44px; height:44px; min-height:44px; flex:none; border-radius:50%; border:none;
  background:var(--card); box-shadow:0 3px 10px rgba(30,20,60,.10); font-size:1rem; color:var(--primary);
  cursor:pointer; padding:0; margin-bottom:0; }
.cal-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.cal-dow, .cal-week{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.cal-dow{ margin-bottom:6px; font-size:0.75rem; color:var(--muted); text-align:center; }
.cal-day{ position:relative; aspect-ratio:1; border:none; border-radius:12px; background:transparent;
  color:var(--text); font-size:0.875rem; cursor:pointer; }
.cal-day.studied{ font-weight:700; }
.cal-day.selected{ background:rgba(59,91,253,.15); }
.cal-day .cal-dot{ position:absolute; bottom:5px; left:50%; transform:translateX(-50%);
  width:5px; height:5px; border-radius:50%; background:var(--primary); }
.cal-day.empty{ pointer-events:none; }
.celebration-overlay{ position:fixed; inset:0; background:rgba(20,15,35,.45); display:flex;
  align-items:center; justify-content:center; z-index:10; padding:24px; cursor:pointer; }
.celebration-card{ background:var(--card); border-radius:var(--radius); padding:32px 24px; text-align:center;
  max-width:320px; box-shadow:0 12px 32px rgba(0,0,0,.25); }
.celebration-card .emoji{ font-size:2.5rem; margin:0 0 8px; }
.grammar-point{ margin-bottom:20px; }
.grammar-point:last-child{ margin-bottom:0; }
.grammar-point-text{ margin:0 0 8px; line-height:1.8; }
.grammar-example{ background:rgba(128,128,128,.08); border-radius:12px; padding:10px 14px; }
.grammar-example .example-en{ margin:0 0 4px; font-weight:600; line-height:1.6; }
.grammar-example .example-en strong{ color:var(--primary); }
.grammar-example .example-note{ margin:0; font-size:0.875rem; color:var(--muted); }
.quit-link{ background:none; border:none; color:var(--muted); font-size:0.875rem; text-decoration:underline;
  cursor:pointer; padding:8px; }
.bottom-nav{ position:fixed; left:0; right:0; bottom:0; max-width:480px; margin:0 auto; z-index:5;
  display:flex; background:var(--card); box-shadow:0 -4px 14px rgba(30,20,60,.10);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom)); }
.bottom-nav-item{ flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
  text-decoration:none; color:var(--muted); font-size:0.6875rem; padding:6px 2px; border-radius:12px; }
.bottom-nav-icon{ font-size:1.25rem; }
.bottom-nav-item.active{ color:var(--primary); font-weight:700; }
#app.has-bottom-nav .actionbar{ bottom:calc(72px + env(safe-area-inset-bottom)); }

/* ---- ゲーム(ペット育成・XP・ミッション・コンボ) ---- */
.pet-card{ text-align:center; padding:18px 16px 16px; }
.pet-top{ display:flex; justify-content:space-between; align-items:center; font-weight:700; font-size:0.875rem; }
.pet-level{ color:var(--primary); }
.pet-streak{ color:var(--accent-warm-dark); }
/* ねこ(SVG)。各パーツ(しっぽ・頭・目・耳)を別々に動かして生き物らしく見せる */
.cat-stage{ position:relative; height:210px; display:flex; align-items:flex-end; justify-content:center; margin:4px 0 6px;
  border-radius:16px; background:linear-gradient(to bottom, rgba(255,159,107,.08) 0%, rgba(255,159,107,.02) 80%, rgba(128,128,128,.12) 80%); }
.cat-stage.small{ height:140px; margin:0 0 10px; }
.cat-stage.tappable{ cursor:pointer; }
.cat{ --fur:#f4a259; --fur-dark:#d9803a; --belly:#fff4e6; --inner-ear:#f7a1b0; --eye:#2d2a32; --blush:rgba(255,110,140,.33); --nose:#e8738a;
  position:relative; transform-origin:50% 100%; margin-bottom:10px; }
.cat-svg{ display:block; width:100%; height:auto; overflow:visible; }
.cat-svg g{ transform-box:fill-box; }
.cat-tail{ transform-origin:0% 100%; animation:cat-tail 2.4s ease-in-out infinite; }
.cat-body{ transform-origin:50% 100%; animation:cat-breathe 3.2s ease-in-out infinite; }
.cat-head{ transform-origin:50% 95%; animation:cat-head-idle 7s ease-in-out infinite; }
.cat-eye{ transform-origin:50% 50%; animation:cat-blink 4.3s infinite; }
.cat-ear-l, .cat-ear-r{ transform-origin:50% 100%; }
.cat-ear-r{ animation:cat-ear 6.5s infinite; }
.cat-eyes-closed, .cat-mouth-open{ display:none; }
@keyframes cat-tail{ 0%,100%{ transform:rotate(-8deg); } 50%{ transform:rotate(14deg); } }
@keyframes cat-breathe{ 0%,100%{ transform:scale(1,1); } 50%{ transform:scale(1.02,1.035); } }
@keyframes cat-head-idle{ 0%,100%{ transform:rotate(0); } 45%{ transform:rotate(0); } 55%{ transform:rotate(-4deg); } 70%{ transform:rotate(3deg); } }
@keyframes cat-blink{ 0%,92%,100%{ transform:scaleY(1); } 95%{ transform:scaleY(.1); } }
@keyframes cat-ear{ 0%,88%,100%{ transform:rotate(0); } 91%{ transform:rotate(-16deg); } 94%{ transform:rotate(5deg); } }
/* 気分・リアクション */
.cat.mood-sad .cat-ear-l{ transform:rotate(-24deg); }
.cat.mood-sad .cat-ear-r{ animation:none; transform:rotate(24deg); }
.cat.mood-sad .cat-eye{ animation:none; transform:scaleY(.5); }
.cat.mood-sad .cat-tail{ animation-duration:5s; }
.cat.anim-purr .cat-eyes-open, .cat.anim-eat .cat-eyes-open, .cat.anim-jump .cat-eyes-open, .cat.anim-spin .cat-eyes-open{ display:none; }
.cat.anim-purr .cat-eyes-closed, .cat.anim-eat .cat-eyes-closed, .cat.anim-jump .cat-eyes-closed, .cat.anim-spin .cat-eyes-closed{ display:inline; }
.cat.anim-purr .cat-head{ animation:cat-purr-head 1.2s ease-in-out 2; }
.cat.anim-purr .cat-body{ animation:cat-vibrate .1s linear 20; }
.cat.anim-purr .cat-tail{ animation-duration:1s; }
.cat.anim-eat .cat-head{ animation:cat-eat .38s ease-in-out .35s 4; }
.cat.anim-eat .cat-mouth{ display:none; }
.cat.anim-eat .cat-mouth-open{ display:inline; }
.cat.anim-jump{ animation:cat-jump .75s cubic-bezier(.3,.7,.4,1); }
.cat.anim-spin{ animation:cat-spin .95s cubic-bezier(.3,.7,.4,1); }
.cat.anim-confused .cat-head{ animation:cat-tilt .35s ease-out forwards; }
.cat.anim-look .cat-eyes-open{ animation:cat-look 1.6s ease-in-out; }
.cat.anim-swish .cat-tail{ animation-duration:.45s; }
.cat.anim-twitch .cat-ear-l, .cat.anim-twitch .cat-ear-r{ animation:cat-ear-twitch .3s ease-in-out 3; }
.cat.anim-stretch{ animation:cat-stretch 1.5s ease-in-out; }
.cat.anim-hop{ animation:cat-hop .5s ease-out 2; }
@keyframes cat-purr-head{ 0%,100%{ transform:rotate(0); } 30%{ transform:rotate(-7deg); } 70%{ transform:rotate(7deg); } }
@keyframes cat-vibrate{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(.8px); } }
@keyframes cat-eat{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(9px) rotate(3deg); } }
@keyframes cat-jump{ 0%{ transform:scale(1.1,.88); } 40%{ transform:translateY(-48px) scale(.94,1.08); } 75%{ transform:translateY(0) scale(1.1,.9); } 100%{ transform:none; } }
@keyframes cat-spin{ 0%{ transform:scale(1.1,.88); } 50%{ transform:translateY(-56px) rotate(180deg); } 85%{ transform:translateY(0) rotate(360deg) scale(1.08,.92); } 100%{ transform:rotate(360deg); } }
@keyframes cat-tilt{ to{ transform:rotate(16deg); } }
@keyframes cat-look{ 0%,100%{ transform:translateX(0); } 25%,40%{ transform:translateX(-5px); } 60%,80%{ transform:translateX(5px); } }
@keyframes cat-ear-twitch{ 0%,100%{ transform:rotate(0); } 50%{ transform:rotate(-14deg); } }
@keyframes cat-stretch{ 0%,100%{ transform:none; } 40%,60%{ transform:scale(1.14,.84); } }
@keyframes cat-hop{ 0%,100%{ transform:none; } 40%{ transform:translateY(-14px); } }
/* 小道具 */
.cat-say{ position:absolute; top:10px; left:50%; z-index:2; max-width:78%; width:max-content; transform:translateX(-50%);
  background:#fff; color:#3a3346; font-weight:700; font-size:0.875rem; line-height:1.45; padding:6px 14px; border-radius:14px;
  box-shadow:0 3px 10px rgba(30,20,60,.14); pointer-events:none; animation:say-pop .35s cubic-bezier(.2,1.5,.4,1) both; }
.cat-say::after{ content:''; position:absolute; left:50%; bottom:-7px; transform:translateX(-50%);
  border-style:solid; border-width:8px 7px 0 7px; border-color:#fff transparent transparent transparent; }
/* 小さい舞台では猫の右上に出す(しっぽは左下向き) */
.cat-say.side{ top:8px; left:calc(50% + 30px); transform:none; max-width:44%; animation-name:say-pop-side; }
.cat-say.side::after{ left:10px; transform:none; bottom:-7px; border-width:8px 10px 0 0; }
.cat-say.wrong{ color:var(--primary); }
@keyframes say-pop{ from{ opacity:0; transform:translateX(-50%) scale(.6); } to{ opacity:1; transform:translateX(-50%) scale(1); } }
@keyframes say-pop-side{ from{ opacity:0; transform:scale(.6); transform-origin:0 100%; } to{ opacity:1; transform:scale(1); } }
.heart{ position:absolute; bottom:60%; font-size:1.25rem; opacity:0; pointer-events:none; animation:heart-float 1.5s ease-out forwards; }
@keyframes heart-float{ 0%{ opacity:0; transform:translateY(0) scale(.5); } 20%{ opacity:1; } 100%{ opacity:0; transform:translateY(-70px) scale(1.1); } }
.bowl{ position:absolute; bottom:8px; left:calc(50% + 52px); width:56px; height:22px; background:#6b9bd2; border-radius:4px 4px 28px 28px; }
.bowl-food{ position:absolute; top:-8px; left:0; right:0; display:flex; justify-content:center; flex-wrap:wrap-reverse; gap:1px; padding:0 6px; }
.bowl-food i{ width:8px; height:8px; border-radius:50%; background:#a0623a; }
.kibble-drop{ position:absolute; bottom:28px; left:calc(50% + 66px); font-size:1.25rem; animation:kibble-drop .4s ease-in both; }
@keyframes kibble-drop{ from{ transform:translateY(-90px); opacity:0; } 30%{ opacity:1; } to{ transform:translateY(0); opacity:0; } }
.toy{ position:absolute; top:2px; left:calc(50% - 112px); width:120px; transform-origin:0 0; animation:toy-swing 2.2s ease-in-out infinite; pointer-events:none; }
.toy.caught{ animation:toy-shake .12s linear 6; }
@keyframes toy-swing{ 0%,100%{ transform:rotate(-7deg); } 50%{ transform:rotate(9deg); } }
@keyframes toy-shake{ 0%,100%{ transform:rotate(0); } 50%{ transform:rotate(6deg); } }
.pet-hand{ position:absolute; top:18px; left:calc(50% - 18px); font-size:2rem; pointer-events:none; animation:pet-stroke .8s ease-in-out 3; }
@keyframes pet-stroke{ 0%,100%{ transform:translateX(-16px) rotate(-10deg); } 50%{ transform:translateX(16px) rotate(10deg); } }
/* お世話ボタン(ごはん/あそぶ/なでなで) */
.care-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; }
.care-btn{ position:relative; display:flex; flex-direction:column; align-items:center; gap:2px; border:none; border-radius:16px;
  padding:12px 4px 10px; background:linear-gradient(160deg, var(--accent-warm), var(--accent-warm-dark)); color:#fff; cursor:pointer;
  box-shadow:0 5px 14px rgba(232,128,74,.3); font-family:inherit; }
.care-btn:active{ transform:scale(.96); }
.care-btn.done{ background:var(--card); color:var(--text); border:1px solid rgba(128,128,128,.25); box-shadow:none; }
.care-icon{ font-size:1.75rem; line-height:1.2; }
.care-label{ font-weight:800; font-size:0.9375rem; }
.care-sub{ font-size:0.6875rem; opacity:.9; }
.care-check{ position:absolute; top:4px; right:6px; font-size:0.875rem; }
.pet-name{ font-weight:700; margin:2px 0 0; }
.pet-rename{ border:none; background:none; font-size:0.875rem; cursor:pointer; padding:4px; }
.pet-card .cat-stage{ height:218px; }
.pet-card .cat-say{ top:16px; font-size:0.9375rem; }
.xp-bar{ height:12px; background:rgba(128,128,128,.2); border-radius:6px; overflow:hidden; margin:0 0 4px; }
.xp-fill{ height:100%; background:linear-gradient(90deg, var(--accent-warm), var(--primary)); border-radius:6px; }
.xp-fill.grow{ animation:xp-grow 1s ease-out both; }
@keyframes xp-grow{ from{ width:var(--from); } to{ width:var(--to); } }
.btn-feed{ margin-top:12px; min-height:56px; font-size:1.0625rem; background:linear-gradient(135deg, var(--accent-warm), var(--accent-warm-dark));
  box-shadow:0 6px 16px rgba(232,128,74,.35); }
.mission-row{ display:flex; align-items:center; gap:10px; width:100%; padding:9px 0; border:none; border-bottom:1px solid rgba(128,128,128,.15);
  background:none; color:inherit; font:inherit; text-align:left; text-decoration:none; cursor:pointer; }
.mission-row:last-of-type{ border-bottom:none; }
.mission-label{ flex:1; }
.mission-row.done .mission-label{ color:var(--muted); text-decoration:line-through; }
.home-menu > summary{ font-size:0.9375rem; margin:0; }
.home-menu[open] > summary{ margin-bottom:14px; }
.home-menu .card{ box-shadow:none; background:rgba(128,128,128,.07); }
.quiz-hud{ display:flex; justify-content:space-between; font-weight:700; font-size:0.875rem; margin:-6px 0 10px; min-height:1.3em; }
.quiz-hud .combo{ color:var(--accent-warm-dark); }
.quiz-hud .xp{ color:var(--primary); }
.combo-pop{ text-align:center; font-weight:800; font-size:1.375rem; color:var(--accent-warm-dark); margin:4px 0 8px;
  animation:combo-pop .45s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes combo-pop{ from{ transform:scale(.4); opacity:0; } to{ transform:scale(1); opacity:1; } }
.choice-btn.correct{ animation:choice-pop .35s ease-out; }
@keyframes choice-pop{ 0%{ transform:scale(1); } 40%{ transform:scale(1.04); } 100%{ transform:scale(1); } }
.game-toast{ position:fixed; top:calc(12px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%); z-index:20;
  background:var(--success); color:#fff; font-weight:700; font-size:0.875rem; padding:10px 18px; border-radius:999px;
  box-shadow:0 6px 18px rgba(0,0,0,.2); animation:toast 2.6s ease-in-out both; pointer-events:none; white-space:nowrap; }
@keyframes toast{ 0%{ opacity:0; transform:translate(-50%,-12px); } 12%,80%{ opacity:1; transform:translate(-50%,0); } 100%{ opacity:0; transform:translate(-50%,-12px); } }
.confetti{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:15; }
.confetti span{ position:absolute; top:-12px; width:8px; height:14px; border-radius:2px; opacity:0; animation:confetti-fall 1.8s ease-in forwards; }
@keyframes confetti-fall{ 0%{ opacity:1; transform:translateY(0) rotate(0); } 100%{ opacity:0; transform:translateY(100vh) rotate(720deg); } }
.game-result{ text-align:center; }
.game-result .xp-gain{ font-size:1.5rem; font-weight:800; color:var(--primary); margin:0; }
/* ---- 旅のちず ---- */
.journey-next{ display:flex; align-items:center; gap:10px; margin-top:12px; padding:10px 12px; border-radius:14px; text-align:left;
  background:rgba(52,195,143,.1); color:inherit; text-decoration:none; }
.jn-icon, .ti-icon{ flex:none; font-size:1.75rem; }
.jn-body, .ti-body{ flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; font-size:0.875rem; }
.jn-req{ font-weight:700; }
.jn-arrow{ flex:none; font-size:1.5rem; color:var(--muted); }
.test-invite{ display:flex; align-items:center; gap:12px; }
.test-invite .btn{ flex:none; margin:0; }
.map{ position:relative; padding:4px 0 4px 8px; }
.map-node{ position:relative; display:flex; gap:12px; padding:0 0 22px; }
.map-node:last-child{ padding-bottom:0; }
.map-node::before{ content:''; position:absolute; left:23px; top:48px; bottom:2px; border-left:3px dashed rgba(128,128,128,.35); }
.map-node:last-child::before{ display:none; }
.map-node.reached::before{ border-left-style:solid; border-left-color:#34c38f; }

function cloneData(obj) { return JSON.parse(JSON.stringify(obj)); }

function mergeWithDefaults(parsed) {
  const base = cloneData(DEFAULT_DATA);
  const merged = Object.assign({}, base, parsed);
  merged.user = Object.assign({}, base.user, parsed.user, {
    parts: Object.assign({}, base.user.parts, parsed.user && parsed.user.parts),
    flags: Object.assign({}, base.user.flags, parsed.user && parsed.user.flags),
  });
  merged.progress = {
    vocab: Object.assign({}, base.progress.vocab, parsed.progress && parsed.progress.vocab),
    grammar: Object.assign({}, base.progress.grammar, parsed.progress && parsed.progress.grammar),
    dailyLog: Object.assign({}, base.progress.dailyLog, parsed.progress && parsed.progress.dailyLog),
    milestoneState: Object.assign({}, base.progress.milestoneState, parsed.progress && parsed.progress.milestoneState),
    game: Object.assign({}, base.progress.game, parsed.progress && parsed.progress.game),
  };
  merged.settings = Object.assign({}, base.settings, parsed.settings);
  merged.history = parsed.history || base.history;
  return merged;
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(LEGACY_STORAGE_KEY);
    if (!raw) return cloneData(DEFAULT_DATA);
    return mergeWithDefaults(JSON.parse(raw));
  } catch (e) {
    return cloneData(DEFAULT_DATA);
  }
}

function save(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

/* ==================== 5. 診断エンジン ==================== */
function interpolateScoreToAccuracy(score, table) {
  if (score <= table[0].score) return table[0].accuracy;
  if (score >= table[table.length - 1].score) return table[table.length - 1].accuracy;
  for (let i = 0; i < table.length - 1; i++) {
    const a = table[i], b = table[i + 1];
    if (score >= a.score && score <= b.score) {
      const ratio = (score - a.score) / (b.score - a.score);
      return a.accuracy + ratio * (b.accuracy - a.accuracy);
    }
  }
  return table[table.length - 1].accuracy;
}

function calcAccuracyGoalFor(partKey, user, config) {
  if (user.goalMode === 'score') {
    return interpolateScoreToAccuracy(user.goalValue, config.goal.scoreToAccuracyTable);
  }
  return user.goalValue;
}

function calcPriority(partKey, user, config) {
  const current = user.parts[partKey];
  if (current == null) return 0;
  const goal = calcAccuracyGoalFor(partKey, user, config);
  const qCount = config.parts[partKey].questionCount;
  return qCount * Math.max(0, goal - current);
}

function rankParts(user, config) {
  return config.partOrder.map((partKey) => {
    const current = user.parts[partKey];
    const goal = calcAccuracyGoalFor(partKey, user, config);
    return {
      part: partKey,
      label: config.parts[partKey].label,
      questionCount: config.parts[partKey].questionCount,
      current, goal,
      priority: calcPriority(partKey, user, config),
    };
  }).sort((a, b) => b.priority - a.priority);
}

function checkFlags(user, config) {
  const p7a = user.parts.P7A, p7b = user.parts.P7B, p5 = user.parts.P5, p6 = user.parts.P6;
  const p7bTimeSuspect = (p7a != null && p7b != null) && (p7a - p7b >= config.thresholds.p7bTimeSuspectDiff);
  const foundationGate = (p5 != null && p5 < config.thresholds.foundationGateAccuracy) ||
                          (p6 != null && p6 < config.thresholds.foundationGateAccuracy);
  return { p7bTimeSuspect, foundationGate };
}

function runDiagnosis(user, config) {
  const ranking = rankParts(user, config);
  const flags = checkFlags(user, config);
  const phase = flags.foundationGate ? '土台フェーズ' : '処理力フェーズ';
  return { ranking, flags, phase };
}

/* ==================== 6. 週次メニュー生成 ==================== */
function moduleScoresFromRanking(ranking, config) {
  const scores = {};
  ranking.forEach((r) => {
    if (r.priority <= 0) return;
    Object.values(config.modules).forEach((mod) => {
      if (mod.targetParts.includes(r.part)) {
        scores[mod.id] = (scores[mod.id] || 0) + r.priority;
      }
    });
  });
  return scores;
}

function pickModuleQueue(ranking, flags, config) {
  const scores = moduleScoresFromRanking(ranking, config);
  if (flags.foundationGate) {
    scores.grammar = (scores.grammar || 0) + 50;
    scores.vocabulary = (scores.vocabulary || 0) + 50;
  }
  if (flags.p7bTimeSuspect) {
    scores.closeReading = (scores.closeReading || 0) + 30;
  }
  const ids = Object.keys(scores).filter((id) => scores[id] > 0).sort((a, b) => scores[b] - scores[a]);
  return ids.length ? ids : ['speedPractice'];
}

function pickNextGrammarUnit(progress, units) {
  const incomplete = units.find((u) => !(progress.grammar.unitStatus[u.id] && progress.grammar.unitStatus[u.id].completed));
  return incomplete || units[0];
}

function buildDayBlocks(moduleQueue, dayIndex, minutesBudget, config, data) {
  const blocks = [];
  let remaining = minutesBudget;
  const grammarUnit = pickNextGrammarUnit(data.progress, GRAMMAR_UNITS);
  const maxBlocksPerDay = 4;
  let i = 0;
  while (remaining >= config.menuRules.blockMinMinutes && blocks.length < maxBlocksPerDay) {
    const modId = moduleQueue[(dayIndex + i) % moduleQueue.length];
    i++;
    const mod = config.modules[modId];
    const minutes = Math.min(mod.defaultMinutes, Math.max(config.menuRules.blockMinMinutes, remaining), config.menuRules.blockMaxMinutes);
    const block = { moduleId: modId, label: mod.label, kpi: mod.kpiTemplate, minutes };
    if (modId === 'grammar') {
      block.route = `#/grammar/${grammarUnit.id}`;
      block.subLabel = grammarUnit.title;
    } else if (modId === 'vocabulary') {
      block.route = mod.route;
      block.subLabel = `語彙${config.menuRules.vocabQuestionCountPerBlock}問`;
    } else if (mod.contentType === 'methodOnly') {
      block.method = mod.method;
    }
    blocks.push(block);
    remaining -= minutes;
  }
  return blocks;
}

function generateWeeklyMenu(user, config, diagnosis, data) {
  const moduleQueue = pickModuleQueue(diagnosis.ranking, diagnosis.flags, config);
  const perDayMinutes = Math.round(user.timeBudgetMin / 7);
  const days = config.menuRules.dayLabels.map((label, idx) => {
    if (idx === 6) {
      const mod = config.modules[config.menuRules.sundayModule];
      const minutes = Math.min(mod.defaultMinutes, config.menuRules.blockMaxMinutes);
      return { day: label, blocks: [{ moduleId: mod.id, label: mod.label, kpi: mod.kpiTemplate, minutes, method: mod.method, subLabel: '予備／通し演習または休養' }] };
    }
    return { day: label, blocks: buildDayBlocks(moduleQueue, idx, perDayMinutes, config, data) };
  });
  const totalMinutes = days.reduce((sum, d) => sum + d.blocks.reduce((s, b) => s + b.minutes, 0), 0);
  return { phase: diagnosis.phase, generatedDate: new Date().toISOString().slice(0, 10), totalMinutes, days };
}

/* ==================== 7. 語彙モジュール ==================== */
function getWordWeight(word, progress) {
  const wrong = progress.vocab.wrongCounts[word.w] || 0;
  const seen = progress.vocab.seenCounts[word.w] || 0;
  return wrong * 3 + (seen === 0 ? 2 : 0) + 1;
}

function pickQuizWords(count, progress, pool) {
  const candidates = pool.map((w) => ({ word: w, weight: getWordWeight(w, progress) }));
  const picked = [];
  for (let n = 0; n < count && candidates.length; n++) {
    const totalWeight = candidates.reduce((s, c) => s + c.weight, 0);
    let r = Math.random() * totalWeight;
    let idx = 0;
    for (; idx < candidates.length; idx++) {
      r -= candidates[idx].weight;
      if (r <= 0) break;
    }
    idx = Math.min(idx, candidates.length - 1);
    picked.push(candidates[idx].word);
    candidates.splice(idx, 1);
  }
  return picked;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildQuizQuestion(targetWord, pool) {
  const distractorPool = pool.filter((w) => w.w !== targetWord.w);
  const distractors = shuffle(distractorPool).slice(0, 3).map((w) => w.m);
  const choices = shuffle([targetWord.m, ...distractors]);
  const answerIndex = choices.indexOf(targetWord.m);
  return { word: targetWord, choices, answerIndex };
}

// mode: 'normal'(10問) | 'quick'(1分クイズ=ペットのごはん)
function startVocabQuiz(count, mode) {
  count = count || CONFIG.menuRules.vocabQuestionCountPerBlock;
  const words = pickQuizWords(count, DATA.progress, BUILTIN_VOCAB);
  const questions = words.map((w) => buildQuizQuestion(w, BUILTIN_VOCAB));
  APP_STATE.vocabSession = { questions, index: 0, correct: 0, results: [], answered: false, lastChoiceIndex: null, mode: mode || 'normal' };
}

function getWrongVocabWords(progress, pool) {
  return pool.filter((w) => (progress.wrongCounts[w.w] || 0) > 0);
}

function startVocabReviewQuiz(offset) {
  offset = offset || 0;
  const wrongWords = getWrongVocabWords(DATA.progress.vocab, BUILTIN_VOCAB);
  const chunk = wrongWords.slice(offset, offset + CONFIG.review.batchSize);
  const questions = chunk.map((w) => buildQuizQuestion(w, BUILTIN_VOCAB));
  APP_STATE.vocabSession = {
    questions, index: 0, correct: 0, results: [], answered: false, lastChoiceIndex: null,
    mode: 'review', reviewOffset: offset, reviewTotalWrong: wrongWords.length,
  };
}

function submitVocabAnswer(choiceIndex) {
  const session = APP_STATE.vocabSession;
  if (!session || session.answered) return;
  const q = session.questions[session.index];
  const isCorrect = choiceIndex === q.answerIndex;
  recordVocabAnswer(q.word.w, isCorrect);
  if (isCorrect) session.correct++;
  session.results.push({ word: q.word, choiceIndex, isCorrect });
  session.answered = true;
  session.lastChoiceIndex = choiceIndex;
  recordDailyActivity(DATA, { vocabQuestionsAnswered: 1 });
  onAnswer(session, isCorrect, 'vocab');
  save(DATA);
}

function advanceVocabQuestion() {
  const session = APP_STATE.vocabSession;
  session.index++;
  session.answered = false;
  session.lastChoiceIndex = null;
  if (session.index >= session.questions.length) {
    DATA.progress.vocab.quizHistory.push({ date: getTodayKey(), correct: session.correct, total: session.questions.length });
    recordDailyActivity(DATA, { vocabQuizzesCompleted: 1 });
    onSessionComplete(session, 'vocab');
    const streakInfo = calcCurrentStreak(DATA.progress.dailyLog, new Date());
    const milestone = checkStreakMilestone(DATA, streakInfo, CONFIG);
    if (milestone) APP_STATE.pendingCelebration = milestone;
    save(DATA);
    location.hash = session.tutorial ? '#/welcome/done' : '#/vocab/result';
  } else {
    render();
  }
}

function startFlashcardSession(count) {
  count = count || 20;
  const deck = pickQuizWords(count, DATA.progress, BUILTIN_VOCAB);
  APP_STATE.flashSession = { deck, index: 0, flipped: false };
}

function advanceFlashcard(delta) {
  const s = APP_STATE.flashSession;
  if (!s) return;
  s.index = Math.max(0, Math.min(s.deck.length - 1, s.index + delta));
  s.flipped = false;
  render();
}

function startGrammarQuiz(unitId) {

}

function getWrongGrammarItems(progress) {
  const items = [];
  GRAMMAR_UNITS.forEach((unit) => {
    unit.quiz.forEach((q, index) => {
      const key = unit.id + ':' + index;

// ねこじゃらし：全ユニットから5問
function startGrammarPlayQuiz() {

  APP_STATE.grammarSession = { mode: 'play', unitId: null, items, index: 0, correct: 0, total: items.length, answered: false, lastChoiceIndex: null };

function startGrammarReviewQuiz(offset) {

  const allWrong = getWrongGrammarItems(DATA.progress.grammar);
  const chunk = allWrong.slice(offset, offset + CONFIG.review.batchSize);
  APP_STATE.grammarSession = {

    answered: false, lastChoiceIndex: null, reviewOffset: offset, reviewTotalWrong: allWrong.length,

}

function submitGrammarAnswer(choiceIndex) {
  const session = APP_STATE.grammarSession;
  if (!session || session.answered) return;
  const item = session.items[session.index];
  const isCorrect = choiceIndex === item.q.answer;
  if (isCorrect) {
    session.correct++;
  } else {
    const key = item.unitId + ':' + item.index;
    DATA.progress.grammar.wrongQuestions[key] = (DATA.progress.grammar.wrongQuestions[key] || 0) + 1;
  }

  session.lastChoiceIndex = choiceIndex;

function finishGrammarQuiz() {
  const session = APP_STATE.grammarSession;
  const score = session.total ? session.correct / session.total : 0;
  if (session.mode === 'unit') {
    const prev = DATA.progress.grammar.unitStatus[session.unitId] || { completed: false, bestScore: 0, attempts: 0, lastScore: 0 };
    DATA.progress.grammar.unitStatus[session.unitId] = {
      completed: true,
      bestScore: Math.max(prev.bestScore, score),
      attempts: prev.attempts + 1,
      lastScore: score,
    };
    recordDailyActivity(DATA, { grammarQuestionsAnswered: session.total, grammarUnitsCompleted: [session.unitId] });
  } else {
    recordDailyActivity(DATA, { grammarQuestionsAnswered: session.total });
  }
  onSessionComplete(session, 'grammar');
  const streakInfo = calcCurrentStreak(DATA.progress.dailyLog, new Date());
  const milestone = checkStreakMilestone(DATA, streakInfo, CONFIG);
  if (milestone) APP_STATE.pendingCelebration = milestone;
  save(DATA);
}

function advanceGrammarQuestion() {
  const session = APP_STATE.grammarSession;
  session.index++;
  session.answered = false;
  session.lastChoiceIndex = null;
  if (session.index >= session.items.length) {
    finishGrammarQuiz();
    location.hash = session.mode === 'unit' ? `#/grammar/${session.unitId}/result` : `#/grammar/${session.mode}/result`;

}

/* ==================== 9.5 デイリーログ／ストリーク／カレンダー／統計 ==================== */
function formatLocalDateKey(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}
function getTodayKey(now) { return formatLocalDateKey(now || new Date()); }
// JSのDate#getDay()は日曜=0..土曜=6。dayLabelsの並び(月=0..日=6)に変換する。
function jsDayToAppIndex(jsDay) { return (jsDay + 6) % 7; }

function recordDailyActivity(data, patch, dateKey) {
  const key = dateKey || getTodayKey();
  const log = data.progress.dailyLog;
  const entry = log[key] || { vocabQuestionsAnswered: 0, vocabQuizzesCompleted: 0, grammarQuestionsAnswered: 0, grammarUnitsCompleted: [] };
  if (patch.vocabQuestionsAnswered) entry.vocabQuestionsAnswered += patch.vocabQuestionsAnswered;
  if (patch.vocabQuizzesCompleted) entry.vocabQuizzesCompleted += patch.vocabQuizzesCompleted;
  if (patch.grammarQuestionsAnswered) entry.grammarQuestionsAnswered += patch.grammarQuestionsAnswered;
  if (patch.grammarUnitsCompleted) {
    patch.grammarUnitsCompleted.forEach((id) => { if (!entry.grammarUnitsCompleted.includes(id)) entry.grammarUnitsCompleted.push(id); });
  }
  log[key] = entry;
  return entry;
}

// 純粋関数：dailyLogと基準日(today)を引数で受け取り、内部ではnew Date()を呼ばない(テストしやすくするため)。
function calcCurrentStreak(dailyLog, today) {
  const now = today || new Date();
  const cursor = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const todayKey = formatLocalDateKey(cursor);
  // 今日がまだ未記録でも「昨日までの記録」を有効なストリークとして扱う(今日やる前に途切れて見えないように)。
  if (!dailyLog[todayKey]) cursor.setDate(cursor.getDate() - 1);
  if (!dailyLog[formatLocalDateKey(cursor)]) return { length: 0, startDate: null, endDate: null };
  const endDate = formatLocalDateKey(cursor);
  let length = 0;
  let startDate = endDate;
  while (dailyLog[formatLocalDateKey(cursor)]) {
    length++;
    startDate = formatLocalDateKey(cursor);
    cursor.setDate(cursor.getDate() - 1);
  }
  return { length, startDate, endDate };
}

// data.progress.milestoneStateを更新し、新たに到達したマイルストーン日数があれば返す(無ければnull)。
function checkStreakMilestone(data, streakInfo, config) {
  const state = data.progress.milestoneState;
  if (state.streakStartDate !== streakInfo.startDate) {
    state.streakStartDate = streakInfo.startDate;
    state.celebrated = [];
  }
  const hit = config.streaks.milestones
    .filter((m) => streakInfo.length >= m && !state.celebrated.includes(m))
    .sort((a, b) => b - a)[0];
  if (hit != null) {
    state.celebrated.push(hit);
    return hit;
  }
  return null;
}

function shiftMonth(year, month, delta) {
  const d = new Date(year, month + delta, 1);
  return { year: d.getFullYear(), month: d.getMonth() };
}

// 純粋関数。month は 0-11 (JSの慣例)。月曜始まりでdayLabelsと揃える。
function buildCalendarMonthGrid(year, month, dailyLog) {
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const leadingBlanks = jsDayToAppIndex(new Date(year, month, 1).getDay());
  const cells = [];
  for (let i = 0; i < leadingBlanks; i++) cells.push(null);
  for (let day = 1; day <= daysInMonth; day++) {
    const key = formatLocalDateKey(new Date(year, month, day));
    cells.push({ day, dateKey: key, studied: !!dailyLog[key] });
  }
  while (cells.length % 7 !== 0) cells.push(null);
  return { year, month, cells };
}

function computeVocabStats(progress, allWords) {
  const seenEntries = Object.entries(progress.seenCounts).filter(([, c]) => c > 0);
  return {
    totalWords: allWords.length,
    totalDistinctSeen: seenEntries.length,
    firstExposure: seenEntries.filter(([, c]) => c === 1).length,
    secondPlusExposure: seenEntries.filter(([, c]) => c >= 2).length,
    wrongWordsCount: Object.values(progress.wrongCounts).filter((c) => c > 0).length,
    quizSessionsCompleted: progress.quizHistory.length,
  };
}

function computeGrammarStats(progress, units) {
  const statuses = units.map((u) => progress.unitStatus[u.id]);
  const completed = statuses.filter((s) => s && s.completed);
  return {
    totalUnits: units.length,
    completedCount: completed.length,
    totalAttempts: statuses.reduce((sum, s) => sum + (s ? s.attempts : 0), 0),
    avgBestScore: completed.length ? completed.reduce((sum, s) => sum + s.bestScore, 0) / completed.length : null,
  };
}

/* ==================== 9.6 ゲーム(XP／レベル／ペット／ミッション／コンボ) ==================== */
// --- 純粋関数(DATA・APP_STATE・new Date()に触れない) ---
function xpToNextLevel(level, gameConfig) {
  return gameConfig.levelBaseXp + gameConfig.levelStepXp * (level - 1);
}

function calcLevelInfo(xp, gameConfig) {
  let level = 1;
  let rest = xp;
  while (rest >= xpToNextLevel(level, gameConfig)) {
    rest -= xpToNextLevel(level, gameConfig);
    level++;
  }
  return { level, current: rest, needed: xpToNextLevel(level, gameConfig) };
}

// ねこの見た目は旅のチェックポイント(=実力)で決まる
function getPetStage(checkpoint, gameConfig) {
  return gameConfig.petStages.filter((s) => checkpoint >= s.minCheckpoint).pop();
}

// --- 旅のちず(実力の判定。純粋関数) ---
function countMasteredWords(vocabProgress, gameConfig) {
  return Object.values(vocabProgress.streaks || {}).filter((n) => n >= gameConfig.masteredStreak).length;
}

function countClearedUnits(grammarProgress, units, gameConfig) {
  return units.filter((u) => {
    const st = grammarProgress.unitStatus[u.id];
    return st && st.completed && st.bestScore >= gameConfig.unitClearScore;
  }).length;
}

function bestTestRatio(tests) {
  return tests.reduce((best, t) => Math.max(best, t.total ? t.correct / t.total : 0), 0);
}

// 旅のゴールに使う目標正答率(診断の目標。スコア目標なら正答率に換算)
function getGoalAccuracy(user, config) {
  return user.goalMode === 'score'
    ? interpolateScoreToAccuracy(user.goalValue, config.goal.scoreToAccuracyTable)
    : user.goalValue;
}

function getGoalLabel(user) {
  return user.goalMode === 'score' ? `目標 ${user.goalValue}点` : `目標 正答率${Math.round(user.goalValue * 100)}%`;
}

// チェックポイントの条件ごとの達成状況。metrics = { words, units, test }
function evaluateCheckpoint(checkpoint, metrics, goalAccuracy) {
  const r = checkpoint.requires;
  const items = [];
  if (r.words != null) items.push({ key: 'words', label: `単語を${r.words}語おぼえる`, current: metrics.words, target: r.words });
  if (r.units != null) items.push({ key: 'units', label: `文法を${r.units}ユニットクリア`, current: metrics.units, target: r.units });
  if (r.test != null) {
    const need = Math.round(goalAccuracy * r.test * 100);
    items.push({ key: 'test', label: `ちからだめしで${need}%以上`, current: Math.round(metrics.test * 100), target: need });
  }
  items.forEach((it) => {
    it.done = it.current >= it.target;
    it.progressText = it.key === 'test' ? `${it.current}%/${it.target}%` : `${it.current}/${it.target}`;
  });
  return { items, met: items.every((it) => it.done) };
}

function getJourneyMetrics(data) {
  return {
    words: countMasteredWords(data.progress.vocab, CONFIG.game),
    units: countClearedUnits(data.progress.grammar, GRAMMAR_UNITS, CONFIG.game),
    test: bestTestRatio(data.progress.game.tests),
  };
}

// 今日学習済み=happy／最後の学習が昨日(または未学習)=hungry／2日以上空いた=sad。罰は与えず表情が変わるだけ。
function getPetMood(dailyLog, today) {
  const cursor = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  if (dailyLog[formatLocalDateKey(cursor)]) return 'happy';
  const keys = Object.keys(dailyLog);
  if (keys.length === 0) return 'hungry';
  cursor.setDate(cursor.getDate() - 1);
  return dailyLog[formatLocalDateKey(cursor)] ? 'hungry' : 'sad';
}

function hashString(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

// シード付き乱数(mulberry32)。同じ日付なら同じミッションになるようにするため。
function seededRandom(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function generateDailyMissions(dateKey, gameConfig, opts) {
  const rand = seededRandom(hashString(dateKey));
  const pool = gameConfig.missionTemplates.filter((t) => !t.requiresWrong || opts.hasWrong);
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  const usedGroups = new Set();
  const items = [];
  for (const t of pool) {
    if (items.length >= gameConfig.missionsPerDay) break;
    const group = t.group || t.event;
    if (usedGroups.has(group)) continue;
    usedGroups.add(group);
    items.push({ id: t.id, progress: 0, goal: t.goal, done: false });
  }
  return items;
}

function findMissionTemplate(id) {
  return CONFIG.game.missionTemplates.find((t) => t.id === id);
}

function pickDailyLine(lines, seedText) {
  return lines[hashString(seedText) % lines.length];
}

// まだ今日やっていないお世話を「おねだり」する。全部済んだらごきげん。
function pickCatLineKey(mood, care) {
  if (mood === 'sad') return 'sad';
  if (!care.feed) return 'wantFeed';
  if (!care.play) return 'wantPlay';
  if (!care.pet) return 'wantPet';
  return 'happy';
}

// 重み付き抽選(重複なし)。weightFnが大きいものほど選ばれやすい。
function weightedSample(items, weightFn, count, rand) {
  rand = rand || Math.random;
  const candidates = items.map((item) => ({ item, weight: weightFn(item) }));
  const picked = [];
  while (picked.length < count && candidates.length > 0) {
    const total = candidates.reduce((sum, c) => sum + c.weight, 0);
    let r = rand() * total;
    let idx = candidates.findIndex((c) => (r -= c.weight) <= 0);
    if (idx < 0) idx = candidates.length - 1;
    picked.push(candidates[idx].item);
    candidates.splice(idx, 1);
  }
  return picked;
}

// ねこじゃらし用：全ユニット横断で文法問題を選ぶ。間違えた問題・学習済みユニットの問題ほど出やすい。
function pickPlayGrammarItems(count, grammarProgress, units) {
  const all = [];
  units.forEach((u) => u.quiz.forEach((q, index) => all.push({ unitId: u.id, index, q })));
  return weightedSample(all, (it) => {
    const wrong = grammarProgress.wrongQuestions[it.unitId + ':' + it.index] || 0;
    const studied = grammarProgress.unitStatus[it.unitId] && grammarProgress.unitStatus[it.unitId].completed;
    return 1 + wrong * 3 + (studied ? 1 : 0);
  }, count);
}

// なでなで用：一度見た単語(特に間違えた単語)を優先。見た単語が足りなければ未学習の単語も混ぜる。
function pickPetWords(count, vocabProgress, pool) {
  const seen = pool.filter((w) => (vocabProgress.seenCounts[w.w] || 0) > 0);
  const base = seen.length >= count ? seen : pool;
  return weightedSample(base, (w) => 1 + (vocabProgress.wrongCounts[w.w] || 0) * 3, count);
}

// --- 状態を更新する関数 ---
// 既存ユーザーのこれまでの頑張りを初回だけXPに換算する。
function initGameState(data) {
  const g = data.progress.game;
  if (g.initialized) return;
  const seenTotal = Object.values(data.progress.vocab.seenCounts).reduce((s, c) => s + c, 0);
  const unitsDone = Object.values(data.progress.grammar.unitStatus).filter((s) => s && s.completed).length;
  g.xp = seenTotal * 2 + unitsDone * 30;
  g.initialized = true;
}

function ensureTodayMissions(data, now) {
  const key = getTodayKey(now);
  const g = data.progress.game;
  if (g.missions.date !== key) {
    const hasWrong = Object.values(data.progress.vocab.wrongCounts).some((c) => c > 0)
      || Object.values(data.progress.grammar.wrongQuestions).some((c) => c > 0);
    g.missions = { date: key, items: generateDailyMissions(key, CONFIG.game, { hasWrong }), bonusClaimed: false };
  }
  return g.missions;
}

function ensureTodayCare(data, now) {
  const key = getTodayKey(now);
  const g = data.progress.game;
  if (g.care.date !== key) g.care = { date: key, feed: 0, play: 0, pet: 0 };
  return g.care;
}

function getCurrentPetStage() {
  return getPetStage(DATA.progress.game.checkpoint, CONFIG.game);
}

// なかよしLv(XP)は「お世話の量」。進化はしない(進化は旅のチェックポイント=実力で起きる)
function addXp(amount) {
  const g = DATA.progress.game;
  const before = calcLevelInfo(g.xp, CONFIG.game);
  g.xp += amount;
  const after = calcLevelInfo(g.xp, CONFIG.game);
  if (after.level > before.level) {
    APP_STATE.gameOverlays.push({ type: 'levelUp', level: after.level });
    APP_STATE.confetti = true;
  }
}

// 条件を満たしたチェックポイントへ進む(一度着いたら戻らない)。silent=trueなら演出なし(初回移行用)
function updateJourney(silent) {
  const g = DATA.progress.game;
  const cps = CONFIG.game.journey;
  const metrics = getJourneyMetrics(DATA);
  const goalAcc = getGoalAccuracy(DATA.user, CONFIG);
  while (g.checkpoint < cps.length - 1 && evaluateCheckpoint(cps[g.checkpoint + 1], metrics, goalAcc).met) {
    const fromStage = getPetStage(g.checkpoint, CONFIG.game);
    g.checkpoint++;
    const toStage = getPetStage(g.checkpoint, CONFIG.game);
    if (!silent) {
      APP_STATE.gameOverlays.push({ type: 'checkpoint', checkpoint: cps[g.checkpoint], fromStage: fromStage.key !== toStage.key ? fromStage : null, toStage });
      APP_STATE.confetti = true;
    }
  }
}

// 旅のちず導入前のデータ向け：2回以上見て一度も間違えていない単語は「覚えた」とみなす(1回だけ)
function initJourney(data) {
  const g = data.progress.game;
  if (g.journeyInitialized) return;
  const v = data.progress.vocab;
  Object.keys(v.seenCounts).forEach((w) => {
    if (v.seenCounts[w] >= CONFIG.game.masteredStreak && !(v.wrongCounts[w] > 0) && v.streaks[w] == null) {
      v.streaks[w] = CONFIG.game.masteredStreak;
    }
  });
  g.journeyInitialized = true;
}

// 単語の回答を記録(クイズ・ちからだめし共通)。streaksは「続けて正解した回数」で、間違えると0に戻る
function recordVocabAnswer(word, isCorrect) {
  const v = DATA.progress.vocab;
  v.seenCounts[word] = (v.seenCounts[word] || 0) + 1;
  if (isCorrect) {
    v.streaks[word] = (v.streaks[word] || 0) + 1;
  } else {
    v.wrongCounts[word] = (v.wrongCounts[word] || 0) + 1;
    v.streaks[word] = 0;
  }
}

// --- ちからだめし(単語12問＋文法8問を全範囲からランダム。実力チェックなので苦手の重み付けはしない) ---
function startTestSession() {
  const cfg = CONFIG.game.test;
  const words = shuffle(BUILTIN_VOCAB).slice(0, cfg.vocab);
  const grammarAll = [];
  GRAMMAR_UNITS.forEach((u) => u.quiz.forEach((q, index) => grammarAll.push({ unitId: u.id, index, q })));
  const grammar = shuffle(grammarAll).slice(0, cfg.grammar);
  const items = shuffle([
    ...words.map((w) => Object.assign({ kind: 'vocab' }, buildQuizQuestion(w, BUILTIN_VOCAB))),
    ...grammar.map((g) => ({ kind: 'grammar', unitId: g.unitId, index: g.index, q: g.q, choices: g.q.choices, answerIndex: g.q.answer })),
  ]);
  APP_STATE.testSession = { mode: 'test', items, index: 0, correct: 0, total: items.length, answered: false, lastChoiceIndex: null, xpGained: 0 };
}

function submitTestAnswer(choiceIndex) {
  const session = APP_STATE.testSession;
  if (!session || session.answered) return;
  const item = session.items[session.index];
  const isCorrect = choiceIndex === item.answerIndex;
  if (isCorrect) session.correct++;
  if (item.kind === 'vocab') {
    recordVocabAnswer(item.word.w, isCorrect);
    recordDailyActivity(DATA, { vocabQuestionsAnswered: 1 });
  } else {
    if (!isCorrect) {
      const key = item.unitId + ':' + item.index;
      DATA.progress.grammar.wrongQuestions[key] = (DATA.progress.grammar.wrongQuestions[key] || 0) + 1;
    }
    recordDailyActivity(DATA, { grammarQuestionsAnswered: 1 });
  }
  session.answered = true;
  session.lastChoiceIndex = choiceIndex;
  onAnswer(session, isCorrect, item.kind);
  save(DATA);
}

function advanceTestQuestion() {
  const session = APP_STATE.testSession;
  session.index++;
  session.answered = false;
  session.lastChoiceIndex = null;
  if (session.index >= session.items.length) {
    const g = DATA.progress.game;
    session.prevBest = bestTestRatio(g.tests);
    g.tests.push({ date: getTodayKey(), correct: session.correct, total: session.total });
    updateJourney();
    checkStreakCelebration();
    save(DATA);
    location.hash = '#/test/result';
  } else {
    render();
  }
}

// 前回のちからだめしから何日たったか(未受験ならnull)
function daysSinceLastTest(tests, now) {
  if (!tests.length) return null;
  const last = tests[tests.length - 1].date.split('-').map(Number);
  const lastDate = new Date(last[0], last[1] - 1, last[2]);
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((today - lastDate) / 86400000);
}

// event: missionTemplates[].eventと対応。comboだけは「これまでの最大値」、それ以外は加算。
function advanceMissions(event, value) {
  const missions = ensureTodayMissions(DATA, new Date());
  missions.items.forEach((item) => {
    const t = findMissionTemplate(item.id);
    if (!t || t.event !== event || item.done) return;
    item.progress = event === 'combo' ? Math.max(item.progress, value) : item.progress + value;
    if (item.progress >= item.goal) {
      item.progress = item.goal;
      item.done = true;
      APP_STATE.gameToast = `✅ ミッション達成：${t.label}`;
    }
  });
  if (!missions.bonusClaimed && missions.items.length > 0 && missions.items.every((i) => i.done)) {
    missions.bonusClaimed = true;
    APP_STATE.gameOverlays.push({ type: 'missionBonus', xp: CONFIG.game.missionBonusXp });
    APP_STATE.confetti = true;
    addXp(CONFIG.game.missionBonusXp);
  }
}

// 1問回答するたびに呼ぶ。kind: 'vocab' | 'grammar'
function onAnswer(session, isCorrect, kind) {
  const cfg = CONFIG.game;
  const g = DATA.progress.game;
  session.combo = isCorrect ? (session.combo || 0) + 1 : 0;
  const bonus = isCorrect ? cfg.comboBonuses.find((b) => b.combo === session.combo) : null;
  const gained = (isCorrect ? cfg.xpPerCorrect : cfg.xpPerWrong) + (bonus ? bonus.xp : 0);
  session.lastCorrect = isCorrect;
  session.lastXp = gained;
  session.lastComboBonus = bonus ? bonus.xp : 0;
  session.xpGained = (session.xpGained || 0) + gained;
  session.maxCombo = Math.max(session.maxCombo || 0, session.combo);
  g.bestCombo = Math.max(g.bestCombo, session.combo);
  if (isCorrect && cfg.confettiCombos.includes(session.combo)) APP_STATE.confetti = true;
  addXp(gained);
  advanceMissions(kind === 'vocab' ? 'vocabAnswer' : 'grammarAnswer', 1);
  if (isCorrect) advanceMissions('correct', 1);
  if (session.mode === 'review') advanceMissions('reviewAnswer', 1);
  if (session.combo > 0) advanceMissions('combo', session.combo);
  playAnswerFeedback(isCorrect, session.combo);
}

function onSessionComplete(session, kind) {
  const care = ensureTodayCare(DATA, new Date());
  if (kind === 'vocab' && session.mode === 'quick') { care.feed++; advanceMissions('quickDone', 1); }
  if (kind === 'grammar' && session.mode === 'play') { care.play++; advanceMissions('playDone', 1); }
  if (kind === 'grammar' && session.mode === 'unit') advanceMissions('grammarUnitDone', 1);
  if (kind === 'pet') { care.pet++; advanceMissions('petDone', 1); }
  updateJourney();
}

function checkStreakCelebration() {
  const streakInfo = calcCurrentStreak(DATA.progress.dailyLog, new Date());
  const milestone = checkStreakMilestone(DATA, streakInfo, CONFIG);
  if (milestone) APP_STATE.pendingCelebration = milestone;
}

// --- なでなで(単語カード。見る→答えを見る→おぼえてた/まだかも を自己申告) ---
function startPetSession() {
  const cards = pickPetWords(CONFIG.game.petCardCount, DATA.progress.vocab, BUILTIN_VOCAB);
  APP_STATE.petSession = { mode: 'pet', cards, index: 0, revealed: false, results: [], correct: 0, total: cards.length, xpGained: 0 };
}

function ratePetCard(known) {
  const session = APP_STATE.petSession;
  if (!session || !session.revealed) return;
  const word = session.cards[session.index];
  const v = DATA.progress.vocab;
  v.seenCounts[word.w] = (v.seenCounts[word.w] || 0) + 1;
  // 「まだかも」の単語は苦手扱いにして、ごはん(クイズ)や復習で出やすくする。
  // 「おぼえてた」は自己申告なので「覚えた単語」の判定(streaks)には使わない
  if (!known) { v.wrongCounts[word.w] = (v.wrongCounts[word.w] || 0) + 1; v.streaks[word.w] = 0; }
  else session.correct++;
  session.results.push({ word, known });
  session.xpGained += CONFIG.game.xpPerPetCard;
  addXp(CONFIG.game.xpPerPetCard);
  recordDailyActivity(DATA, { vocabQuestionsAnswered: 1 });
  session.index++;
  session.revealed = false;
  if (session.index >= session.cards.length) {
    onSessionComplete(session, 'pet');
    checkStreakCelebration();
    save(DATA);
    location.hash = '#/pet/result';
  } else {
    save(DATA);
    render();
  }
}

// --- 効果音(Web Audio APIで合成。音声ファイル不要)と振動 ---
let audioCtx = null;
function playTones(freqs, duration) {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    audioCtx = audioCtx || new Ctx();
    freqs.forEach((f, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const t = audioCtx.currentTime + i * 0.09;
      osc.type = 'sine';
      osc.frequency.value = f;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.18, t + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + duration + 0.02);
    });
  } catch (e) { /* 音が鳴らなくてもアプリは動かす */ }
}

// ホームのねこが数秒おきに勝手に動く(きょろきょろ・耳ぴくぴく・しっぽふりふり・のび・ぴょん)。
// タップ中(anim-purr)などほかのアニメ中は邪魔しない。
function startCatIdleLoop() {
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduceMotion) return;
  const moves = ['anim-look', 'anim-twitch', 'anim-swish', 'anim-stretch', 'anim-hop', 'anim-look'];
  setInterval(() => {
    const cat = document.querySelector('.cat-stage.idle-live .cat');
    if (!cat || /\banim-/.test(cat.className) || document.hidden) return;
    const move = moves[Math.floor(Math.random() * moves.length)];
    cat.classList.add(move);
    cat._animTimer = setTimeout(() => cat.classList.remove(move), 1700);
  }, 3800);
}

// ゴロゴロ音(低い音を小刻みに)
function playPurr() {
  if (!DATA.settings.soundOn) return;
  playTones([110, 98, 110, 98, 110], 0.12);
}

function playAnswerFeedback(isCorrect, combo) {
  if (!DATA.settings.soundOn) return;
  if (isCorrect) playTones(combo >= 5 ? [880, 1175, 1568] : combo >= 3 ? [880, 1175] : [988], 0.16);
  else playTones([330, 247], 0.18);
  // iPhoneのSafariはvibrate非対応(音と画面演出で代替)
  if (navigator.vibrate) navigator.vibrate(isCorrect ? (combo >= 3 ? [15, 40, 15] : 12) : 40);
}

/* ==================== 10. ルーター ==================== */
function parseRoute(hash) {
  const path = (hash || '#/input').slice(1);
  const pathname = path.split('?')[0];
  return pathname.split('/').filter(Boolean);
}

function renderInputRoute(app) {
  if (DATA.user.hasTakenToeic == null) return renderExperienceGate(app);
  if (DATA.user.hasTakenToeic === false) return renderBeginnerProfile(app);
  return renderInputForm(app);
}

function render() {
  const segments = parseRoute(location.hash);
  const [root, a, b] = segments;
  const app = document.getElementById('app');
  renderRoute(app, root, a, b);
  renderBottomNav(app, root);
  // クイズ中はレベルアップ等の全画面カードを出さず、結果画面・ホームで見せる(回答の邪魔をしない)
  const inQuiz = (root === 'vocab' && a === 'quiz') || (root === 'grammar' && b === 'quiz') || (root === 'pet' && !a) || (root === 'test' && !a);
  renderGameEffects(app, inQuiz);
}

function renderRoute(app, root, a, b) {
  // はじめての案内がまだなら、案内(とチュートリアルの3問)以外は見せない
  const inTutorial = root === 'vocab' && APP_STATE.vocabSession && APP_STATE.vocabSession.tutorial;
  if (!DATA.progress.game.onboarded && root !== 'welcome' && !inTutorial) {
    if (location.hash !== '#/welcome') { location.hash = '#/welcome'; return; }
  }
  if (root === 'welcome') return renderWelcome(app, a);
  if (!root) return renderHome(app);
  if (root === 'journey') return renderJourney(app);
  if (root === 'test') return a === 'result' ? renderTestResult(app) : renderTest(app);
  if (root === 'input') return renderInputRoute(app);
  if (root === 'home') return renderHome(app);
  if (root === 'calendar') return renderCalendar(app);
  if (root === 'settings') return renderSettings(app);
  if (root === 'help') return renderHelp(app);
  if (root === 'diagnosis') return renderDiagnosis(app);
  if (root === 'menu') return renderMenu(app);
  if (root === 'grammar') {
    if (!a) return renderGrammarList(app);
    if (a === 'stats') return renderGrammarStats(app);
    if (a && !b) return renderGrammarUnit(app, a);
    if (b === 'quiz') return renderGrammarQuiz(app, a);
    if (b === 'result') return renderGrammarResult(app, a);
  }
  if (root === 'vocab') {
    if (!a) return renderVocabHome(app);
    if (a === 'stats') return renderVocabStats(app);
    if (a === 'flashcards') return renderVocabFlashcards(app);
    if (a === 'quiz') return renderVocabQuiz(app);
    if (a === 'result') return renderVocabResult(app);
  }
  if (root === 'pet') {
    if (a === 'result') return renderPetResult(app);
    return renderPetSession(app);
  }
  if (root === 'p7b') {
    if (a === 'retest') return renderP7bRetest(app);
    if (a === 'result') return renderP7bResult(app);
  }
  return renderInputRoute(app);
}

function renderBottomNav(app, root) {
  app.classList.remove('has-bottom-nav');
  if (!DATA.progress.game.onboarded || root === 'welcome') return;
  const effectiveRoot = root || 'home';
  const items = [
    { key: 'home', href: '#/home', icon: '🏠', label: 'ホーム' },
    { key: 'journey', href: '#/journey', icon: '🗺️', label: 'ちず' },
    { key: 'calendar', href: '#/calendar', icon: '📅', label: 'カレンダー' },
    { key: 'menu', href: '#/menu', icon: '☰', label: 'メニュー' },
    { key: 'settings', href: '#/settings', icon: '⚙️', label: '設定' },
  ];
  const navHtml = `<nav class="bottom-nav">${items.map((it) => {
    const active = effectiveRoot === it.key;
    return `<a class="bottom-nav-item${active ? ' active' : ''}" href="${it.href}">
      <span class="bottom-nav-icon">${it.icon}</span><span class="bottom-nav-label">${it.label}</span>
    </a>`;
  }).join('')}</nav>`;
  app.classList.add('has-bottom-nav');
  app.insertAdjacentHTML('beforeend', navHtml);
}

    <span class="jn-body">
      <span class="muted">つぎの目的地：<strong style="color:var(--text);">${next.name}</strong></span>
      <span class="jn-req">${focus.label}（${focus.progressText}）${pending.length > 1 ? ` ほか${pending.length - 1}つ` : ''}</span>
      ${meterHtml(focus.current / focus.target, 'green')}
    </span>
    <span class="jn-arrow">›</span>
  </a>`;
}

// 最高正答率→星(90%以上★3／70%以上★2／それ以外★1)
function starsHtml(bestScore) {
  const n = bestScore >= 0.9 ? 3 : bestScore >= 0.7 ? 2 : 1;
  return `<span class="stars" aria-label="星${n}つ">${'★'.repeat(n)}<span class="off">${'★'.repeat(3 - n)}</span></span>`;
}

function meterHtml(ratio, variant) {
  // 少しでも進んでいれば、ほんの少しだけバーを見せる(0%に見えるとやる気が出ないため)
  const w = ratio > 0 ? Math.max(3, Math.min(100, Math.round(ratio * 100))) : 0;
  return `<div class="meter${variant ? ' ' + variant : ''}"><i style="width:${w}%"></i></div>`;
}

const TOY_SVG = `<svg class="toy" viewBox="0 0 120 90" aria-hidden="true">
  <path d="M2 2 Q60 8 92 50" stroke="#8a6a4a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M92 50 q16 6 18 28 q-16 -4 -18 -28z" fill="#ff7eb6"/>
  <path d="M92 50 q-4 18 6 32 q4 -18 -6 -32z" fill="#7ec8ff"/>
  <path d="M92 50 q8 14 4 30" stroke="#f7c948" stroke-width="2" fill="none"/>
</svg>`;

// 猫の吹き出し。side=trueで猫の右上(小さい舞台用)
function catSayHtml(text, opts) {
  opts = opts || {};
  const cls = ['cat-say', opts.side ? 'side' : '', opts.wrong ? 'wrong' : ''].filter(Boolean).join(' ');
  return `<div class="${cls}"${opts.id ? ` id="${opts.id}"` : ''}>${text}</div>`;
}

// 回答したときの猫のリアクション(再描画で変わらないよう、問題番号で選ぶ)
const STAGE_LINES = {
  feed: ['おいしい！', 'もぐもぐ♪', 'うまうま〜', 'おかわり！'],
  play: ['つかまえた！', 'えいっ！', 'にゃっ！', 'とった〜！'],
  wrong: ['あれれ？', 'むむ…？', 'ちがうかも？', 'つぎはいける！'],
  pet: ['ゴロゴロ…', 'きもちいい〜', 'もっと〜', 'しあわせ〜'],
};
function stageLine(kind, index) { return STAGE_LINES[kind][index % STAGE_LINES[kind].length]; }

// クイズ画面上部の「ねこの舞台」。scene: 'feed'(ごはん) | 'play'(ねこじゃらし)
function careStageHtml(scene, session) {
  const stage = getCurrentPetStage();
  const answered = session.answered;
  const correct = answered && session.lastCorrect;
  let anim = '';
  if (answered) {
    if (!correct) anim = 'anim-confused';
    else if (scene === 'feed') anim = 'anim-eat';
    else anim = session.combo >= 3 ? 'anim-spin' : 'anim-jump';
  }
  let props = '';
  if (scene === 'feed') {
    const food = Math.min(session.correct, 8);
    props = `<div class="bowl"><div class="bowl-food">${'<i></i>'.repeat(food)}</div></div>${correct ? '<span class="kibble-drop">🐟</span>' : ''}`;
  } else {
    props = TOY_SVG.replace('class="toy"', `class="toy${correct ? ' caught' : ''}"`);
  }
  return `<div class="cat-stage small scene-${scene}">
    ${props}
    ${catHtml(stage, { anim, size: 100 })}
    ${answered ? catSayHtml(!correct ? stageLine('wrong', session.index)
      : session.combo >= 3 ? `${session.combo}コンボ！すごい！` : stageLine(scene, session.index), { side: true, wrong: !correct }) : ''}
    ${correct && session.combo >= 3 ? heartsHtml(3) : ''}
  </div>`;
}

// fromRatioを渡すと、そこから現在値までバーが伸びるアニメーションになる
function xpBarHtml(info, fromRatio) {
  const to = Math.round((info.current / info.needed) * 100);
  if (fromRatio == null) return `<div class="xp-bar"><div class="xp-fill" style="width:${to}%"></div></div>`;
  const from = Math.max(0, Math.min(to, Math.round(fromRatio * 100)));
  return `<div class="xp-bar"><div class="xp-fill grow" style="--from:${from}%; --to:${to}%; width:${to}%"></div></div>`;
}

function quizHudHtml(session) {
  const combo = session.combo || 0;
  return `<div class="quiz-hud">
    <span class="combo">${combo >= 2 ? `🔥 ${combo}コンボ` : ''}</span>
    <span class="xp">⭐ ${session.xpGained || 0} XP</span>
  </div>`;
}

// 回答直後だけ出す「+10 XP」「3 COMBO!」表示
function answerFeedbackHtml(session) {
  if (!session.answered || !session.lastXp) return '';
  if (session.lastComboBonus) {
    return `<div class="combo-pop">🔥 ${session.combo} COMBO! +${session.lastXp} XP</div>`;
  }
  return `<div class="combo-pop" style="font-size:1rem; color:var(--primary);">+${session.lastXp} XP</div>`;
}

// 結果画面に出すカード。セッションが無い(再読み込み後など)場合は何も出さない。
const RESULT_LINES = {
  quick: ['おいしかった〜！まんぷく！', 'ごちそうさま！', 'もうちょっと食べたいな…'],
  play: ['たのしかった〜！またあそぼ！', 'いいうごきだったにゃ！', 'もっとあそびたいな…'],
  pet: ['ゴロゴロ…しあわせ〜', 'きもちよかった〜', 'もっとなでてほしいな'],
  other: ['すごい！がんばったね！', 'おつかれさま！', 'つぎはもっといけるよ！'],
};

function gameResultCardHtml(session) {
  if (!session || !session.xpGained) return '';
  const info = calcLevelInfo(DATA.progress.game.xp, CONFIG.game);
  const stage = getCurrentPetStage();
  const fromRatio = (info.current - session.xpGained) / info.needed; // レベルが上がった場合は負→0から伸びる
  const ratio = session.questions ? session.correct / session.questions.length : session.correct / session.total;
  const lines = RESULT_LINES[session.mode] || RESULT_LINES.other;
  const line = ratio >= 0.8 ? lines[0] : ratio >= 0.5 ? lines[1] : lines[2];
  const anim = session.mode === 'pet' ? 'anim-purr' : ratio >= 0.8 ? 'anim-spin' : ratio >= 0.5 ? 'anim-jump' : '';
  return `
    <div class="card game-result">
      <p class="xp-gain">+${session.xpGained} XP</p>
      ${session.maxCombo >= 2 ? `<p class="muted">最大 ${session.maxCombo} コンボ</p>` : ''}
      <div class="cat-stage small">${catHtml(stage, { anim, size: 100 })}${ratio >= 0.8 ? heartsHtml(3) : ''}${catSayHtml(line, { side: true })}</div>
      <p class="muted" style="margin:0 0 4px;">💗 なかよしLv.${info.level}　次まで あと ${info.needed - info.current} XP</p>
      ${xpBarHtml(info, fromRatio)}
      ${journeyNextHtml()}
    </div>`;
}

function confettiHtml() {
  const colors = ['#ff9f6b', '#3b5bfd', '#2f9e44', '#f7c948', '#e5484d', '#b86bff'];
  const pieces = Array.from({ length: 36 }, (_, i) => {
    const left = Math.round(Math.random() * 100);
    const delay = (Math.random() * 0.5).toFixed(2);
    const dur = (1.4 + Math.random() * 0.9).toFixed(2);
    return `<span style="left:${left}%; background:${colors[i % colors.length]}; animation-delay:${delay}s; animation-duration:${dur}s;"></span>`;
  }).join('');
  return `<div class="confetti" aria-hidden="true">${pieces}</div>`;
}

function gameOverlayHtml(overlay) {
  if (overlay.type === 'levelUp') {
    return `
      <div class="celebration-overlay" data-action="dismissGameOverlay">
        <div class="celebration-card">
          <div class="cat-stage small" style="background:none;">${catHtml(getCurrentPetStage(), { anim: 'anim-purr', size: 100 })}${heartsHtml(3)}</div>
          <p><strong>💗 なかよしLv.${overlay.level} になった！</strong></p>
          <p class="muted">毎日のお世話で、なかよしになったよ</p>
          <p class="muted">タップでとじる</p>
        </div>
      </div>`;
  }
  if (overlay.type === 'checkpoint') {
    const cp = overlay.checkpoint;
    const evolved = overlay.fromStage;
    const isGoal = cp.id === CONFIG.game.journey[CONFIG.game.journey.length - 1].id;
    return `
      <div class="celebration-overlay" data-action="dismissGameOverlay">
        <div class="celebration-card">
          <p class="emoji">${cp.icon}</p>
          <div class="cat-stage small" style="background:none;">${catHtml(overlay.toStage, { anim: 'anim-spin', size: 100 })}</div>
          <p><strong>「${cp.name}」に着いた！</strong></p>
          ${evolved ? `<p><strong>✨ ${evolved.name} → ${overlay.toStage.name} に進化！</strong></p>` : ''}
          <p class="muted">${isGoal ? '目標の山頂に到着！ほんとうにおめでとう！' : 'きみの実力がついた証拠だにゃ'}</p>
          <p class="muted">タップでとじる</p>
        </div>
      </div>`;
  }
  if (overlay.type === 'missionBonus') {
    return `
      <div class="celebration-overlay" data-action="dismissGameOverlay">
        <div class="celebration-card">
          <p class="emoji">🍰</p>
          <p><strong>今日のミッション全部クリア！</strong></p>
          <p>ごちそうボーナス +${overlay.xp} XP</p>
          <p class="muted">タップでとじる</p>
        </div>
      </div>`;
  }
  return '';
}

// 紙吹雪・トーストは1回表示したら消す。全画面カードはタップで閉じるまで残す。
function renderGameEffects(app, inQuiz) {

  const todayAppIndex = jsDayToAppIndex(now.getDay());
  if (APP_STATE.selectedDayIndex == null) APP_STATE.selectedDayIndex = todayAppIndex;
  const idx = ((APP_STATE.selectedDayIndex % 7) + 7) % 7;
  const day = menu.days[idx];

  const streak = calcCurrentStreak(DATA.progress.dailyLog, now);
  const celebration = APP_STATE.pendingCelebration;
  APP_STATE.pendingCelebration = null;

  // --- ペット ---
  const g = DATA.progress.game;
  const info = calcLevelInfo(g.xp, CONFIG.game);
  const stage = getCurrentPetStage();
  const mood = getPetMood(DATA.progress.dailyLog, now);
  const care = ensureTodayCare(DATA, now);
  const diagnosed = DATA.history.length > 0;
  const sinceTest = daysSinceLastTest(g.tests, now);
  const testDue = sinceTest == null || sinceTest >= CONFIG.game.test.intervalDays;
  const lineKey = pickCatLineKey(mood, care);
  const speech = pickDailyLine(CONFIG.game.moodLines[lineKey], getTodayKey(now) + lineKey);
  const careButtons = CONFIG.game.careActions.map((c) => {
    const done = care[c.key] > 0;
    return `<button class="care-btn${done ? ' done' : ''}" data-action="${c.action}">
      ${done ? '<span class="care-check">✅</span>' : ''}
      <span class="care-icon">${c.icon}</span><span class="care-label">${c.label}</span><span class="care-sub">${c.sub}</span>
    </button>`;
  }).join('');

  // --- 今日のミッション ---
  const missions = ensureTodayMissions(DATA, now);
  save(DATA);
  const doneCount = missions.items.filter((i) => i.done).length;
  const missionRows = missions.items.map((item) => {
    const t = findMissionTemplate(item.id);
    if (!t) return '';
    const inner = `<span>${item.done ? '✅' : '⬜'}</span><span class="mission-label">${t.label}</span><span class="muted">${item.progress}/${item.goal}</span>`;
    if (item.done) return `<div class="mission-row done">${inner}</div>`;
    if (t.action) return `<button class="mission-row" data-action="${t.action}">${inner}</button>`;
    if (t.href) return `<a class="mission-row" href="${t.href}">${inner}</a>`;
    return `<div class="mission-row">${inner}</div>`;
  }).join('');

  app.innerHTML = `
    <div class="home-help-link"><a href="#/help">📖 使い方</a></div>
    <div class="card pet-card">
      <div class="pet-top">
        <span class="pet-level">💗 なかよしLv.${info.level}</span>
        ${streak.length > 0 ? `<span class="pet-streak">🔥 ${streak.length}日連続</span>` : '<span></span>'}
      </div>
      <div class="cat-stage tappable idle-live" data-action="tapPet" role="button" aria-label="ねこをなでる">
        ${catSayHtml(speech, { id: 'pet-speech' })}
        ${catHtml(stage, { mood, size: 185 })}
      </div>
      <p class="pet-name">${g.petName ? escapeHtml(g.petName) : `${stage.name}<span class="muted">（なまえをつけてね）</span>`}
        <button class="pet-rename" data-action="renamePet" aria-label="なまえを変える">✏️</button></p>
      ${xpBarHtml(info)}
      <p class="muted" style="margin:0;">なかよしLv.${info.level + 1}まで あと ${info.needed - info.current} XP</p>
      <div class="care-grid">${careButtons}</div>
      ${journeyNextHtml()}
    </div>
    ${testDue ? `
      <div class="card test-invite">
        <span class="ti-icon">🏔️</span>
        <span class="ti-body"><strong>${sinceTest == null ? 'はじめてのちからだめし' : '今週のちからだめし'}</strong>
          <span class="muted">単語${CONFIG.game.test.vocab}問＋文法${CONFIG.game.test.grammar}問で、いまの実力をチェック。旅を進めるのに必要だよ</span></span>
        <button class="btn small" data-action="startTest">挑戦</button>
      </div>` : ''}
    ${diagnosed ? '' : `
      <a class="card test-invite" href="#/input" style="text-decoration:none; color:inherit;">
        <span class="ti-icon">🎯</span>
        <span class="ti-body"><strong>目標を決めよう（3分）</strong>
          <span class="muted">目標スコアと苦手なパートを診断すると、旅のゴールと学習メニューがきみ用になるよ</span></span>
        <span class="jn-arrow">›</span>
      </a>`}
    <div class="card">
      <h2>今日のミッション <span class="muted">${doneCount}/${missions.items.length}</span></h2>
      ${missionRows}
      <p class="muted" style="margin:8px 0 0;">${missions.bonusClaimed ? '🍰 今日のごちそうはもらったよ！' : `全部クリアでごちそうボーナス +${CONFIG.game.missionBonusXp} XP 🍰`}</p>
    </div>
    <div class="row-flex" style="margin-bottom:12px;">
      <a class="btn secondary" href="#/vocab">語彙をやる</a>

function renderCalendar(app) {
  const now = new Date();
  if (APP_STATE.calendarYear == null) {
    APP_STATE.calendarYear = now.getFullYear();
    APP_STATE.calendarMonth = now.getMonth();
  }
  const grid = buildCalendarMonthGrid(APP_STATE.calendarYear, APP_STATE.calendarMonth, DATA.progress.dailyLog);
  const streak = calcCurrentStreak(DATA.progress.dailyLog, now);
  const selectedKey = APP_STATE.selectedCalendarDay;
  const detail = selectedKey ? DATA.progress.dailyLog[selectedKey] : null;

  const weeks = [];
  for (let i = 0; i < grid.cells.length; i += 7) weeks.push(grid.cells.slice(i, i + 7));
  const todayKey = getTodayKey(now);
  const gridHtml = weeks.map((week) => `<div class="cal-week">${week.map((c) => c
    ? `<button class="cal-day ${c.studied ? 'studied' : ''} ${c.dateKey === selectedKey ? 'selected' : ''} ${c.dateKey === todayKey ? 'today' : ''}" data-action="selectCalendarDay" data-date="${c.dateKey}">${c.day}${c.studied ? '<span class="cal-paw">🐾</span>' : ''}</button>`
    : `<span class="cal-day empty"></span>`).join('')}</div>`).join('');
  const monthDays = grid.cells.filter((c) => c && c.studied).length;
  const line = monthDays === 0 ? 'べんきょうした日に🐾がつくよ'
    : streak.length >= 3 ? `${streak.length}日連続！すごいにゃ〜` : `今月は${monthDays}日がんばったにゃ`;

  app.innerHTML = `
    ${pageHeroHtml('calendar', '📅 カレンダー', line)}
    <div class="chip-row">
      <div class="chip"><b>🔥 ${streak.length}</b>日連続</div>
      <div class="chip"><b><span class="paw">🐾</span> ${monthDays}</b>今月の学習日</div>
      <div class="chip"><b>⭐ ${Object.keys(DATA.progress.dailyLog).length}</b>これまでの合計</div>
    </div>
    <div class="card">
      <div class="cal-nav">
        <button class="btn small secondary" data-action="shiftCalendarMonth" data-delta="-1">◀</button>
        <strong>${APP_STATE.calendarYear}年${APP_STATE.calendarMonth + 1}月</strong>
        <button class="btn small secondary" data-action="shiftCalendarMonth" data-delta="1">▶</button>
      </div>
      <div class="cal-dow">${CONFIG.menuRules.dayLabels.map((l) => `<span>${l}</span>`).join('')}</div>
      ${gridHtml}
    </div>
    ${detail ? `
      <div class="card">
        <h2>🐾 ${selectedKey}の記録</h2>
        <p>🔤 語彙: ${detail.vocabQuestionsAnswered}問（クイズ${detail.vocabQuizzesCompleted}回）</p>
        <p>📐 文法: ${detail.grammarQuestionsAnswered}問（完了ユニット${detail.grammarUnitsCompleted.length}）</p>

}

function renderGrammarList(app) {
  const nextUnit = pickNextGrammarUnit(DATA.progress, GRAMMAR_UNITS);

  const itemsHtml = GRAMMAR_UNITS.map((u, i) => {
    const status = DATA.progress.grammar.unitStatus[u.id];
    const done = status && status.completed;
    const isNext = !done && u.id === nextUnit.id;
    const meta = done
      ? `${starsHtml(status.bestScore)} <span>最高${Math.round(status.bestScore * 100)}%</span>`
      : `${isNext ? '<span class="badge next">つぎはここ！</span>' : ''}全${u.quiz.length}問`;
    return `
      <a class="card unit-card${done ? ' done' : ''}${isNext ? ' next' : ''}" href="#/grammar/${u.id}">
        <span class="unit-num">${i + 1}</span>
        <span class="unit-body"><span class="unit-title">${u.title}</span><br><span class="unit-meta">${meta}</span></span>
        ${done ? '<span class="unit-stamp" aria-label="完了">🐾</span>' : ''}

  const wrongCount = getWrongGrammarItems(DATA.progress.grammar).length;
  const line = completedCount === GRAMMAR_UNITS.length ? 'ぜんぶクリア！天才だにゃ'

  app.innerHTML = `

function renderGrammarQuiz(app, unitId) {
  let session = APP_STATE.grammarSession;
  const needsRestart = !session
    || (unitId === 'review' && session.mode !== 'review')
    || (unitId === 'play' && session.mode !== 'play')
    || (unitId !== 'review' && unitId !== 'play' && (session.mode !== 'unit' || session.unitId !== unitId));
  if (needsRestart) {
    if (unitId === 'review') startGrammarReviewQuiz(0);
    else if (unitId === 'play') startGrammarPlayQuiz();
    else startGrammarQuiz(unitId);
    session = APP_STATE.grammarSession;
  }
  if (session.items.length === 0) {
    app.innerHTML = `
      <h1>復習モード</h1>
      <div class="card"><p class="muted">間違えた文法問題はまだありません。まずは通常のクイズに挑戦してみましょう。</p></div>
      <div class="actionbar"><a class="btn secondary" href="#/grammar">ユニット一覧に戻る</a></div>
    `;
    return;
  }
  const item = session.items[session.index];
  const unit = GRAMMAR_UNITS.find((u) => u.id === item.unitId);
  const q = item.q;
  const choicesHtml = q.choices.map((c, i) => {
    let cls = 'choice-btn';
    if (session.answered) {
      if (i === q.answer) cls += ' correct';
      else if (i === session.lastChoiceIndex) cls += ' incorrect';
    }
    return `<button class="${cls}" data-action="chooseGrammarAnswer" data-index="${i}" ${session.answered ? 'disabled' : ''}>${c}</button>`;
  }).join('');
  const progressPct = Math.round((session.index / session.items.length) * 100);
  const titleLabel = session.mode === 'review' ? `復習モード（${unit.title}）`
    : session.mode === 'play' ? '🪶 あそびタイム' : unit.title;
  app.innerHTML = `
    <h1>${titleLabel}（${session.index + 1}/${session.items.length}）</h1>
    <div class="progress"><div class="progress-fill" style="width:${progressPct}%"></div></div>
    ${quizHudHtml(session)}

  `;
}

// ===== 旅のちず =====
function renderJourney(app) {
  const g = DATA.progress.game;
  const cps = CONFIG.game.journey;
  const metrics = getJourneyMetrics(DATA);
  const goalAcc = getGoalAccuracy(DATA.user, CONFIG);
  const stage = getCurrentPetStage();
  const nodes = cps.map((cp, i) => {
    const reached = i <= g.checkpoint;
    const isHere = i === g.checkpoint;
    const isNext = i === g.checkpoint + 1;
    const ev = evaluateCheckpoint(cp, metrics, goalAcc);
    let body = '';
    if (isNext) {
      body = ev.items.map((it) => `
        <div class="map-req">${it.done ? '<span class="done">✅</span>' : '⬜'} ${it.label}
          <span class="muted">（${it.progressText}）</span>${it.done ? '' : meterHtml(it.current / it.target, 'green')}</div>`).join('');
    } else if (!reached) {
      body = `<div class="map-req muted">${ev.items.map((it) => it.label).join('・')}</div>`;
    } else if (!isHere) {
      body = '<div class="map-req done">✅ とうちゃく</div>';
    }
    const petStage = CONFIG.game.petStages.find((ps) => ps.minCheckpoint === i && i > 0);
    return `
      <div class="map-node${reached ? ' reached' : ''}${isNext ? ' next' : ''}${!reached && !isNext ? ' locked' : ''}">
        <div class="map-dot">${isHere ? catHtml(stage, { size: Math.round(40 / stage.scale) }) : cp.icon}</div>
        <div class="map-body">
          <div class="map-name">${isHere ? cp.icon + ' ' : ''}${cp.name}${isHere ? '<span class="map-here">いまここ</span>' : ''}</div>
          ${petStage && !reached ? `<div class="muted" style="font-size:.75rem;">✨ 着くと「${petStage.name}」に進化</div>` : ''}
          ${body}
        </div>
      </div>`;
  }).reverse().join('');
  const tests = g.tests;
  const best = bestTestRatio(tests);
  const last = tests[tests.length - 1];
  app.innerHTML = `
    ${pageHeroHtml('journey', '🗺️ たびのちず', `ゴールは「${getGoalLabel(DATA.user)}」だにゃ`)}
    <div class="stat-grid">
      <div class="stat-tile"><div class="e">📖</div><div class="v">${metrics.words}</div><div class="k">おぼえた単語（2回つづけて正解）</div></div>
      <div class="stat-tile"><div class="e">📐</div><div class="v">${metrics.units}<small class="muted" style="font-size:.875rem;"> / ${GRAMMAR_UNITS.length}</small></div><div class="k">クリアした文法（7割以上）</div></div>
    </div>
    <div class="card test-invite">
      <span class="ti-icon">🏔️</span>
      <span class="ti-body"><strong>ちからだめし</strong>
        <span class="muted">${last ? `ベスト ${Math.round(best * 100)}%／前回 ${Math.round((last.correct / last.total) * 100)}%（${last.date}）` : 'まだ挑戦していないよ'}</span></span>
      <button class="btn small" data-action="startTest">挑戦</button>
    </div>
    <div class="card map">${nodes}</div>
    <p class="muted center">「覚えた単語」は2回つづけて正解した単語、「クリア」は文法ユニットのクイズで最高7割以上です。</p>
  `;
}
